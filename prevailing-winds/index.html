<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prevailing Winds Lab</title><style>
:root{color-scheme:dark;--bg:#171517;--panel:#231f23;--maroon:#7a1f36;--rose:#b14d6c;--text:#f5f1f4;--muted:#d2c5ce;--gold:#e2c77a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#38252e,var(--bg) 65%);color:var(--text);font:16px system-ui,sans-serif}main{max-width:1250px;margin:auto;padding:24px}h1{margin:0 0 8px;font-size:clamp(26px,4vw,38px)}p{line-height:1.5;color:var(--muted);margin:8px 0}nav,.controls,.legend{display:flex;flex-wrap:wrap;gap:10px;align-items:center}nav{margin:22px 0 16px}button{font:inherit;color:inherit;background:linear-gradient(#41343d,#292329);border:1px solid #62515e;border-radius:10px;padding:10px 16px;cursor:pointer}button[aria-selected=true],button[aria-pressed=true]{background:linear-gradient(#922847,#7a1f36);border-color:#b14d6c;box-shadow:inset 0 1px #ffffff30}button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}.panel{background:linear-gradient(145deg,#2b252b,#201d20);border:1px solid #51434e;border-radius:18px;padding:18px;box-shadow:0 12px 35px #0004}.controls{margin-bottom:14px}.controls label{display:flex;align-items:center;gap:8px}select{font:inherit;color:var(--text);background:#292329;border:1px solid #62515e;border-radius:8px;padding:8px}input{accent-color:#b14d6c}.visuals{display:grid;grid-template-columns:1fr 1fr;gap:14px}.visuals.single{grid-template-columns:1fr}figure{margin:0;background:#17171d;border:1px solid #51434e;border-radius:12px;overflow:hidden}figcaption{padding:10px 14px;color:var(--muted);font-size:14px;border-bottom:1px solid #51434e}canvas{width:100%;display:block;aspect-ratio: 1.05} .single canvas{aspect-ratio:1.65;max-height:470px} .visuals.globe canvas{aspect-ratio:1.25;max-height:680px}.legend{font-size:14px;margin:14px 0}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.prompt{border-top:1px solid #51434e;padding-top:12px}.prompt strong{color:var(--gold)}[hidden]{display:none!important}@media(max-width:760px){main{padding:12px}.visuals{grid-template-columns:1fr}.single canvas{aspect-ratio:1.4}} </style>
<main><h1>Prevailing Winds Lab</h1><nav role="tablist" aria-label="Models"><button role="tab" aria-selected="true">1 · Convection</button><button role="tab" aria-selected="false">2 · Simple planet</button><button role="tab" aria-selected="false">3 · Earth</button><button role="tab" aria-selected="false">4 · 3D Earth</button></nav><section class="panel" role="tabpanel"><div class="controls"><button id="rotation" aria-pressed="false" hidden>Rotation: off</button><button id="pause" aria-pressed="false">Pause</button><button id="reset">Reset</button><label>Animation speed <input id="speed" type="range" min="0.25" max="2" step="0.25" value="1"></label><label id="hemisphereLabel" hidden>View <select id="hemisphere"><option value="both">Both hemispheres</option><option value="north">Northern hemisphere</option><option value="south">Southern hemisphere</option></select></label><label id="orientationLabel" hidden>Cross-section orientation <select id="orientation"><option value="horizontal">Horizontal</option><option value="vertical">Vertical</option><option value="tilted">Earth tilt (23.4°)</option></select></label><label id="heatLabel">Target heating difference <input id="heat" type="range" min="0" max="1" step="0.05" value="0.8"><output id="heatNow">0%</output></label><label id="namesLabel" hidden><input type="checkbox" id="names"> Show wind names</label></div><div class="visuals single" id="visuals"><figure><figcaption id="cap">Side view · air chamber</figcaption><canvas id="a" aria-label="Animated vertical air circulation"></canvas></figure><figure id="surface" hidden><figcaption>Surface winds</figcaption><canvas id="b" aria-label="Animated surface winds by latitude"></canvas></figure></div><div class="legend"><span><i class="dot" style="background:#ff967e"></i>Warmer air</span><span><i class="dot" style="background:#83c8f4"></i>Cooler air</span><span id="windLegend"><i class="dot" style="background:#e2c77a"></i>Surface wind</span><span><strong style="color:#ffad9d">L</strong> Low pressure</span><span><strong style="color:#9ed8ff">H</strong> High pressure</span></div></section></main><script>
const $=id=>document.getElementById(id), tabs=[...document.querySelectorAll('[role=tab]')];let mode=0,rot=false,paused=false,t=0,actualHeat=0,heatPhase=0,last=performance.now();const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;if(reduced){paused=true;$('pause').textContent='Play';$('pause').setAttribute('aria-pressed','true')}
function update(){tabs.forEach((b,i)=>b.setAttribute('aria-selected',i===mode));$('rotation').hidden=!mode||mode===3;$('hemisphereLabel').hidden=!mode||mode===3;$('orientationLabel').hidden=!mode||mode===3;$('rotation').textContent='Rotation: '+(rot?'on':'off');$('rotation').setAttribute('aria-pressed',rot);$('surface').hidden=!mode||mode===3;$('windLegend').hidden=!mode;$('visuals').classList.toggle('single',!mode||mode===3);$('visuals').classList.toggle('globe',mode===3);$('heatLabel').hidden=!!mode;$('namesLabel').hidden=mode!==2;$('cap').textContent=mode===3?'Global atmospheric circulation':mode?'Atmospheric cross-section':'Side view · air chamber'}
tabs.forEach((b,i)=>{b.onclick=()=>{mode=i;rot=i===2;t=0;actualHeat=0;heatPhase=0;update()};b.onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();let n=(i+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length;tabs[n].click();tabs[n].focus()}}});$('rotation').onclick=()=>{rot=!rot;update()};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Play':'Pause';$('pause').setAttribute('aria-pressed',paused)};$('reset').onclick=()=>{t=0;actualHeat=0;heatPhase=0;rot=mode===2;$('heat').value=.8;$('speed').value=1;$('names').checked=false;update()};
let drawingAngle=0;
function setup(el){let r=el.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);if(!r.width)return;let w=Math.round(r.width*d),h=Math.round(r.height*d);if(el.width!==w||el.height!==h){el.width=w;el.height=h}let c=el.getContext('2d');c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,w,h);let orient=$('orientation').value;drawingAngle=mode&&mode!==3&&el.id==='a'?(orient==='horizontal'?0:orient==='vertical'?Math.PI/2:Math.PI/2+23.4*Math.PI/180):0;let co=Math.abs(Math.cos(drawingAngle)),si=Math.abs(Math.sin(drawingAngle));let scale=Math.min(w/(600*co+500*si),h/(600*si+500*co));c.translate(w/2,h/2);c.scale(scale,scale);c.rotate(drawingAngle);c.translate(-300,-250);return c}
function text(c,s,x,y,color='#d2c5ce',size=16){c.save();c.translate(x,y);c.rotate(-drawingAngle);c.fillStyle=color;c.font=`${size}px system-ui`;c.textAlign='center';c.textBaseline='middle';c.fillText(s,0,-size*.3);c.restore()}function line(c,x,y,X,Y,color='#77717e',width=1){c.strokeStyle=color;c.lineWidth=width;c.beginPath();c.moveTo(x,y);c.lineTo(X,Y);c.stroke()}function arrow(c,x,y,X,Y,color){line(c,x,y,X,Y,color,2);let a=Math.atan2(Y-y,X-x);c.fillStyle=color;c.beginPath();c.moveTo(X,Y);c.lineTo(X-10*Math.cos(a-.5),Y-10*Math.sin(a-.5));c.lineTo(X-10*Math.cos(a+.5),Y-10*Math.sin(a+.5));c.fill()}function dot(c,x,y,color,r=4){c.fillStyle=color;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill()}
function loop(c,left,right,top,bottom,dir,phase,amount=1,gradual=false){
 const r=Math.min(24,(right-left)*.24,(bottom-top)*.24), pts=[];
 const add=(x,y)=>{let p=pts.at(-1);if(!p||Math.hypot(x-p[0],y-p[1])>1e-6)pts.push([x,y])};
 function edge(x,y,X,Y){let n=Math.max(2,Math.ceil(Math.hypot(X-x,Y-y)/3));for(let i=0;i<n;i++)add(x+(X-x)*i/n,y+(Y-y)*i/n)}
 function corner(x,y,a){for(let i=0;i<16;i++){let q=a+i*Math.PI/32;add(x+r*Math.cos(q),y+r*Math.sin(q))}}
 edge(left+r,top,right-r,top);corner(right-r,top+r,-Math.PI/2);edge(right,top+r,right,bottom-r);corner(right-r,bottom-r,0);edge(right-r,bottom,left+r,bottom);corner(left+r,bottom-r,Math.PI/2);edge(left,bottom-r,left,top+r);corner(left+r,top+r,Math.PI);
 const lengths=[0];for(let i=1;i<=pts.length;i++){let a=pts[i-1],b=pts[i%pts.length];lengths.push(lengths[i-1]+Math.hypot(b[0]-a[0],b[1]-a[1]))}const total=lengths.at(-1);
 function pos(f){let d=((f%1+1)%1)*total,i=0;while(lengths[i+1]<d)i++;let a=pts[i],b=pts[(i+1)%pts.length],q=(d-lengths[i])/(lengths[i+1]-lengths[i]);return [a[0]+(b[0]-a[0])*q,a[1]+(b[1]-a[1])*q]}
 c.save();if(gradual)c.globalAlpha=Math.min(1,amount*2);c.strokeStyle='#827680';c.lineWidth=1.5;c.beginPath();pts.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.closePath();c.stroke();
 for(let j=0;j<4;j++){let f=j/4+.08;arrow(c,...pos(f),...pos(f+dir*.025),'#b5a5b2')}
 c.restore();for(let j=0;j<16;j++){let p=pos(j/16+phase*dir*.18);let warm=dir===1?p[0]<(left+right)/2:p[0]>(left+right)/2;let color=amount<.02?'#aaa1a8':warm?'#ff967e':'#83c8f4';if(gradual){let a=[170,161,168],b=warm?[255,150,126]:[131,200,244];color='rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*amount)).join(',')+')'}dot(c,...p,color,3.3)}
}
function pressure(c,x,y,low){let color=low?'#ffad9d':'#9ed8ff';c.fillStyle='#25232b';c.strokeStyle=color;c.lineWidth=1.5;c.beginPath();c.arc(x,y,13,0,Math.PI*2);c.fill();c.stroke();c.save();c.translate(x,y);c.rotate(-drawingAngle);c.fillStyle=color;c.font='15px system-ui';c.textAlign='center';c.textBaseline='middle';c.fillText(low?'L':'H',0,0);c.restore()}
function chamber(){let c=setup($('a'));if(!c)return;let h=actualHeat;$('heatNow').textContent=Math.round(h*100)+'%';c.fillStyle='#24232b';c.fillRect(65,65,470,365);let g=c.createLinearGradient(65,0,535,0);g.addColorStop(0,`rgba(255,100,65,${h*.35})`);g.addColorStop(1,`rgba(70,150,255,${h*.35})`);c.fillStyle=g;c.fillRect(65,65,470,365);c.strokeStyle='#80747f';c.strokeRect(65,65,470,365);text(c,'Cooler end',455,455,'#83c8f4');text(c,'Heated end',145,455,'#ff967e');loop(c,115,485,105,390,1,heatPhase,h,true);if(h>.05){pressure(c,115,414,true);pressure(c,485,414,false)}text(c,'Heating difference: '+Math.round(h*100)+'%',300,42)}
const cells=()=>mode===2?3:1;
const latitudes=n=>{let a=n===3?[-90,-60,-30,0,30,60,90]:[-90,0,90],v=$('hemisphere').value;return a.filter(l=>v==='both'||(v==='north'?l>=0:l<=0))};
const lowAt=lat=>lat===0||Math.abs(lat)===60;
const latName=lat=>lat===0?'0°':Math.abs(lat)+'°'+(lat<0?'S':'N');
function cross(){let c=setup($('a'));if(!c)return;let n=cells(),ls=latitudes(n),min=ls[0],max=ls.at(-1);let x=lat=>48+(max-lat)/(max-min)*504;let grad=c.createLinearGradient(48,0,552,0);ls.forEach(lat=>{let q=Math.abs(lat)/90;grad.addColorStop((max-lat)/(max-min),`rgb(${Math.round(168-128*q)},${Math.round(77-6*q)},${Math.round(64+36*q)})`)});c.fillStyle=grad;c.fillRect(48,385,504,18);
 for(let k=0;k<ls.length-1;k++){let l=ls[k],r=ls[k+1],mid=(l+r)/2;let dir=mid<0?1:-1;if(n===3&&Math.floor(Math.abs(mid)/30)===1)dir*=-1;loop(c,x(r)+5,x(l)-5,85,365,dir,t*.55,n===3&&Math.floor(Math.abs(mid)/30)===1?0:1);}
 for(let lat of latitudes(n)){line(c,x(lat),365,x(lat),385,'#827680');pressure(c,x(lat),385,lowAt(lat));text(c,latName(lat),x(lat),432,'#d2c5ce',14)}}
function surface(){let c=setup($('b'));if(!c)return;let n=cells(),ls=latitudes(n),min=ls[0],max=ls.at(-1),Y=lat=>45+(max-lat)/(max-min)*405;for(let k=0;k<ls.length-1;k++){let top=Y(ls[k+1]),bottom=Y(ls[k]);c.fillStyle=k%2?'#222b37':'#29303a';c.fillRect(88,top,457,bottom-top)}
 for(let lat of ls){line(c,88,Y(lat),545,Y(lat),'#67717d');text(c,latName(lat),27,Y(lat)+5,'#d2c5ce',13);pressure(c,66,Y(lat),lowAt(lat))}
 c.save();c.beginPath();c.rect(88,45,457,405);c.clip();
 for(let k=0;k<ls.length-1;k++){let low=ls[k],high=ls[k+1],mid=(low+high)/2;let poleward=n===3&&Math.floor(Math.abs(mid)/30)===1;let dy=(mid>0?1:-1)*(poleward?-1:1);let east=rot?(poleward?1:-1):0;let y0=Y(high),height=Y(low)-y0;
 for(let j=0;j<9;j++){let x=90+j*76-76;let start=y0+height*(dy>0?.12:.88),end=y0+height*(dy>0?.88:.12);let bend=east*68;function pos(f){return rot?[x+bend*(1-Math.cos(f*Math.PI/2)),start+(end-start)*Math.sin(f*Math.PI/2)]:[x,start+(end-start)*f]};c.strokeStyle='#e2c77a';c.lineWidth=2;c.beginPath();c.moveTo(x,start);for(let q=1;q<=40;q++)c.lineTo(...pos(q/40));c.stroke();arrow(c,...pos(.96),...pos(1),'#e2c77a');for(let p=0;p<3;p++){let f=(t*.22+p/3+j*.11)%1;dot(c,...pos(f),'#f4d998',2.8)}}
 if(mode===2&&rot&&$('names').checked){let name=poleward?'Westerlies':Math.abs(mid)<30?'Trade winds':'Polar easterlies';c.save();c.translate(315,y0+height/2);c.rotate(-drawingAngle);c.fillStyle='#17171de8';c.fillRect(-66,-12,132,24);c.restore();text(c,name,315,y0+height/2+5,'#f5f1f4',14)}}c.restore();text(c,'WEST',110,23);text(c,'EAST',520,23);}

function globe(){
 const c=setup($('a'));if(!c)return;
 const R=166,cx=300,cy=250,D=Math.PI/180,tilt=23.4*D,view=12*D,spin=t*.09;
 function project(lat,lon,h=0){let a=lat*D,b=lon*D+spin,r=R*(1+h),x=r*Math.cos(a)*Math.sin(b),y=r*Math.sin(a),z=r*Math.cos(a)*Math.cos(b);let Y=y*Math.cos(view)-z*Math.sin(view),Z=y*Math.sin(view)+z*Math.cos(view);return [cx+x*Math.cos(tilt)+Y*Math.sin(tilt),cy+x*Math.sin(tilt)-Y*Math.cos(tilt),Z]}
 function visible(p){return p[2]>=0||Math.hypot(p[0]-cx,p[1]-cy)>R+1}
 function trace(fn,color,width=1,front=true){c.beginPath();let prev=null;for(let i=0;i<=100;i++){let p=fn(i/100),ok=front?visible(p):!visible(p);if(ok){if(prev)c.lineTo(p[0],p[1]);else c.moveTo(p[0],p[1]);prev=p}else prev=null}c.strokeStyle=color;c.lineWidth=width;c.stroke()}
 let halo=c.createRadialGradient(cx,cy,R*.85,cx,cy,R*1.35);halo.addColorStop(0,'#547b9b22');halo.addColorStop(.45,'#769bc528');halo.addColorStop(1,'#769bc500');c.fillStyle=halo;c.beginPath();c.arc(cx,cy,R*1.35,0,2*Math.PI);c.fill();
 let g=c.createRadialGradient(cx-65,cy-75,12,cx,cy,R);g.addColorStop(0,'#537b90');g.addColorStop(.65,'#29495d');g.addColorStop(1,'#142331');c.fillStyle=g;c.beginPath();c.arc(cx,cy,R,0,Math.PI*2);c.fill();c.strokeStyle='#a3bbc477';c.lineWidth=1.4;c.stroke();
 // Latitude belts on the sphere, and longitude graticule.
 for(let lon=0;lon<360;lon+=30)trace(f=>project(-90+180*f,lon),'#b4c9d326',.8);
 for(let lat=-60;lat<=60;lat+=30)trace(f=>project(lat,360*f),lat===0?'#e2c77a99':'#b4c9d366',lat===0?1.5:1);
 // Surface paths originate near highs, bend into zonal flow near lows.
 for(let a=-90;a<90;a+=30){let mid=a+15,poleward=Math.abs(mid)>30&&Math.abs(mid)<60,dir=(mid>0?1:-1)*(poleward?1:-1),start=dir>0?a+3:a+27,end=dir>0?a+27:a+3,east=poleward?1:-1;
 for(let lon=0;lon<360;lon+=36){let fn=f=>project(start+(end-start)*Math.sin(f*Math.PI/2),lon+east*30*(1-Math.cos(f*Math.PI/2)),.012);trace(fn,'#e2c77ac0',1.7);let p=fn(1),q=fn(.94);if(visible(p)&&visible(q))arrow(c,q[0],q[1],p[0],p[1],'#e2c77a');for(let j=0;j<2;j++){let p=fn((t*.18+j/2+lon/360)%1);if(visible(p))dot(c,p[0],p[1],'#fff0bb',2.1)}}}
 // Meridional overturning loops at selected longitudes, with vertical motion and elevated return flow.
 for(let lon of [0,120,240])for(let a=-90;a<90;a+=30){let mid=a+15,ferrel=Math.abs(mid)>30&&Math.abs(mid)<60;let poleward=ferrel,dir=(mid>0?1:-1)*(poleward?1:-1),start=dir>0?a+2:a+28,end=dir>0?a+28:a+2;
 function path(f){let u=f*4,lat,h;if(u<1){lat=start+(end-start)*u;h=.045}else if(u<2){lat=end;h=.045+.20*(u-1)}else if(u<3){lat=end+(start-end)*(u-2);h=.245}else{lat=start;h=.245-.20*(u-3)}return project(lat,lon,h)}
 let col=ferrel?'#c7bec9':Math.abs(mid)<30?'#ff967e':'#83c8f4';trace(path,col+'99',1.6);for(let j=0;j<5;j++){let p=path((t*.10+j/5)%1);if(visible(p))dot(c,p[0],p[1],col,2.8)}for(let f of [.22,.47,.72,.97]){let p=path(f),q=path(f-.035);if(visible(p)&&visible(q))arrow(c,q[0],q[1],p[0],p[1],col)}}
 // Pressure markers follow the tilted axis on the left limb.
 for(let lat=-90;lat<=90;lat+=30){let p=project(lat,-90-spin/D);let x=p[0]-19,y=p[1];pressure(c,x,y,lowAt(lat));text(c,latName(lat),x-29,y+4,'#d2c5ce',12)}
 text(c,'N',cx+R*Math.sin(tilt)*Math.cos(view),cy-R*Math.cos(tilt)*Math.cos(view)-30,'#f5f1f4',15);text(c,'S',cx-R*Math.sin(tilt)*Math.cos(view),cy+R*Math.cos(tilt)*Math.cos(view)+30,'#f5f1f4',15);
}

function frame(now){let dt=Math.min(.05,(now-last)/1000);last=now;if(!paused){let step=dt*+$('speed').value;t+=step;if(!mode){let target=+$('heat').value;actualHeat+=Math.sign(target-actualHeat)*Math.min(Math.abs(target-actualHeat),step/12);heatPhase+=step*actualHeat}}if(mode===3)globe();else if(mode){cross();surface()}else chamber();requestAnimationFrame(frame)}update();requestAnimationFrame(frame);
</script></html>
