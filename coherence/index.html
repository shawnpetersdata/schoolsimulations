const documents = ["<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Parallelism Puzzle — School Simulations<\/title>\n<style>\n:root {\n    --bg1: #171517;\n    --bg2: #231f23;\n    --panel: rgba(62, 56, 62, 0.92);\n    --panel-2: rgba(79, 71, 78, 0.95);\n    --maroon: #7a1f36;\n    --maroon-2: #922847;\n    --maroon-soft: #b14d6c;\n    --grey-1: #d5d0d4;\n    --grey-2: #aaa1a8;\n    --grey-3: #786f77;\n    --text: #f5f1f4;\n    --muted: #d2c5ce;\n    --gold: #e2c77a;\n    --success: #1f704e;\n    --danger: #7b3240;\n    --shadow: rgba(0,0,0,0.35);\n}\n\n* { box-sizing: border-box; }\n\nhtml, body {\n    margin: 0;\n    min-height: 100%;\n    font-family: \"Trebuchet MS\", \"Segoe UI\", Arial, sans-serif;\n    color: var(--text);\n    background:\n        radial-gradient(circle at 15% 20%, rgba(255,255,255,0.08) 0 2px, transparent 2px 100%),\n        radial-gradient(circle at 80% 10%, rgba(255,255,255,0.07) 0 1.5px, transparent 1.5px 100%),\n        radial-gradient(circle at 70% 70%, rgba(255,255,255,0.05) 0 2px, transparent 2px 100%),\n        linear-gradient(145deg, #1a171a 0%, #241d22 45%, #161518 100%);\n    background-size: 260px 260px, 320px 320px, 240px 240px, auto;\n}\n\nbody::before,\nbody::after {\n    content: \"\";\n    position: fixed;\n    pointer-events: none;\n    inset: 0;\n    z-index: 0;\n}\n\nbody::before {\n    background:\n        radial-gradient(circle at 10% 15%, rgba(226,199,122,0.16), transparent 18%),\n        radial-gradient(circle at 85% 18%, rgba(177,77,108,0.18), transparent 22%),\n        radial-gradient(circle at 30% 88%, rgba(255,255,255,0.05), transparent 18%),\n        radial-gradient(circle at 78% 80%, rgba(122,31,54,0.22), transparent 20%);\n}\n\nbody::after {\n    opacity: 0.3;\n    background-image:\n        linear-gradient(120deg, transparent 0 48%, rgba(255,255,255,0.08) 49%, transparent 50% 100%),\n        linear-gradient(45deg, transparent 0 47.5%, rgba(255,255,255,0.04) 48%, transparent 49% 100%);\n    background-size: 180px 180px, 240px 240px;\n}\n\nmain {\n    position: relative;\n    z-index: 1;\n    max-width: 980px;\n    margin: 0 auto;\n    padding: 28px 18px 50px;\n}\n\n.hero {\n    position: relative;\n    overflow: hidden;\n    padding: 28px 28px 24px;\n    margin-bottom: 22px;\n    border-radius: 28px;\n    background:\n        linear-gradient(155deg, rgba(122,31,54,0.92), rgba(66,54,63,0.96) 55%, rgba(32,29,33,0.95));\n    border: 1px solid rgba(255,255,255,0.14);\n    box-shadow:\n        0 18px 40px var(--shadow),\n        inset 0 1px 0 rgba(255,255,255,0.18),\n        inset 0 0 0 2px rgba(255,255,255,0.04);\n}\n\n.hero::before {\n    content: \"\";\n    position: absolute;\n    inset: auto -10% -30% auto;\n    width: 240px;\n    height: 240px;\n    border-radius: 50%;\n    background: radial-gradient(circle, rgba(255,255,255,0.12), transparent 65%);\n}\n\n.hero::after {\n    content: \"✦  ✧  ✦\";\n    position: absolute;\n    top: 18px;\n    right: 22px;\n    letter-spacing: 8px;\n    color: rgba(255,255,255,0.55);\n    font-size: 1.15rem;\n}\n\n.brand-row {\n    display: flex;\n    gap: 18px;\n    align-items: center;\n    flex-wrap: wrap;\n}\n\n.badge {\n    width: 94px;\n    height: 94px;\n    flex: 0 0 auto;\n    border-radius: 24px;\n    display: grid;\n    place-items: center;\n    background:\n        radial-gradient(circle at 35% 30%, rgba(255,255,255,0.35), rgba(255,255,255,0.08) 18%, transparent 19%),\n        radial-gradient(circle at 65% 60%, rgba(255,255,255,0.28), rgba(255,255,255,0.05) 16%, transparent 17%),\n        linear-gradient(145deg, #9f5d73, #7a1f36 48%, #4e3944 100%);\n    border: 1px solid rgba(255,255,255,0.22);\n    box-shadow:\n        inset 0 1px 0 rgba(255,255,255,0.28),\n        0 8px 18px rgba(0,0,0,0.28);\n    color: white;\n    font-size: 2rem;\n    text-shadow: 0 0 10px rgba(255,255,255,0.35);\n}\n\n.overline {\n    text-transform: uppercase;\n    letter-spacing: 2.6px;\n    color: var(--gold);\n    font-size: 0.78rem;\n    margin: 0 0 6px;\n}\n\nh1 {\n    margin: 0;\n    font-size: clamp(2rem, 4vw, 3rem);\n    line-height: 1.03;\n}\n\n.subtitle {\n    margin: 10px 0 0;\n    max-width: 760px;\n    color: var(--grey-1);\n    line-height: 1.65;\n    font-size: 1.03rem;\n}\n\n.chips {\n    display: flex;\n    flex-wrap: wrap;\n    gap: 10px;\n    margin-top: 18px;\n}\n\n.chip {\n    padding: 8px 14px;\n    border-radius: 999px;\n    background: rgba(255,255,255,0.09);\n    border: 1px solid rgba(255,255,255,0.12);\n    color: var(--grey-1);\n    font-size: 0.92rem;\n    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);\n}\n\n.panel {\n    position: relative;\n    overflow: hidden;\n    background:\n        linear-gradient(180deg, rgba(77,69,76,0.96), rgba(50,45,51,0.97));\n    border: 1px solid rgba(255,255,255,0.12);\n    border-radius: 24px;\n    padding: 24px;\n    box-shadow:\n        0 16px 34px rgba(0,0,0,0.28),\n        inset 0 1px 0 rgba(255,255,255,0.12);\n}\n\n.panel::before {\n    content: \"\";\n    position: absolute;\n    inset: 0;\n    pointer-events: none;\n    background:\n        linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent),\n        radial-gradient(circle at 92% 8%, rgba(255,255,255,0.14) 0 2px, transparent 3px),\n        radial-gradient(circle at 88% 12%, rgba(255,255,255,0.09) 0 1.8px, transparent 2.8px),\n        radial-gradient(circle at 94% 15%, rgba(255,255,255,0.07) 0 1.3px, transparent 2.4px);\n}\n\n.stats {\n    display: flex;\n    justify-content: space-between;\n    gap: 10px;\n    flex-wrap: wrap;\n    color: var(--grey-1);\n    font-weight: 700;\n}\n\n.stats-card {\n    padding: 10px 14px;\n    background: rgba(0,0,0,0.18);\n    border: 1px solid rgba(255,255,255,0.09);\n    border-radius: 14px;\n    min-width: 150px;\n}\n\n.progress {\n    height: 14px;\n    border-radius: 999px;\n    margin: 18px 0 6px;\n    padding: 2px;\n    background: rgba(15,12,15,0.45);\n    border: 1px solid rgba(255,255,255,0.06);\n}\n\n#bar {\n    width: 0%;\n    height: 100%;\n    border-radius: inherit;\n    background:\n        linear-gradient(90deg, #b24f6e, #e2c77a 55%, #f8e9ba 100%);\n    box-shadow: 0 0 14px rgba(226,199,122,0.5);\n    transition: width 0.35s ease;\n}\n\n.section-label {\n    display: inline-block;\n    margin-top: 14px;\n    font-size: 0.8rem;\n    text-transform: uppercase;\n    letter-spacing: 2px;\n    color: var(--gold);\n}\n\n#sentence {\n    margin: 18px 0 24px;\n    font-size: clamp(1.3rem, 2.4vw, 1.72rem);\n    line-height: 1.7;\n    color: #fffafc;\n}\n\n.blank {\n    color: #ffe9a8;\n    font-weight: 700;\n    border-bottom: 3px dashed rgba(255,233,168,0.9);\n    padding-bottom: 2px;\n}\n\n.choices {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 14px;\n}\n\nbutton {\n    font: inherit;\n    cursor: pointer;\n    border: none;\n    border-radius: 16px;\n    transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;\n}\n\n.choice {\n    position: relative;\n    text-align: left;\n    padding: 16px 18px 16px 50px;\n    color: var(--text);\n    background:\n        linear-gradient(180deg, rgba(126,112,122,0.23), rgba(58,50,57,0.58)),\n        linear-gradient(145deg, rgba(255,255,255,0.04), rgba(255,255,255,0));\n    border: 1px solid rgba(255,255,255,0.13);\n    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);\n    min-height: 76px;\n}\n\n.choice::before {\n    content: \"✦\";\n    position: absolute;\n    left: 18px;\n    top: 50%;\n    transform: translateY(-50%);\n    color: rgba(255,255,255,0.58);\n    font-size: 1rem;\n}\n\n.choice:hover:not(:disabled) {\n    transform: translateY(-1px);\n    background:\n        linear-gradient(180deg, rgba(164,91,118,0.35), rgba(70,58,66,0.76));\n    box-shadow:\n        0 10px 20px rgba(0,0,0,0.18),\n        0 0 0 1px rgba(255,255,255,0.07) inset;\n}\n\n.choice:disabled {\n    cursor: default;\n}\n\n.choice.correct {\n    background: linear-gradient(180deg, rgba(53,129,95,0.92), rgba(26,91,66,0.96));\n    border-color: rgba(184,244,220,0.45);\n}\n\n.choice.wrong {\n    background: linear-gradient(180deg, rgba(142,62,82,0.95), rgba(110,44,60,0.98));\n    border-color: rgba(255,196,207,0.35);\n}\n\n#feedback {\n    margin-top: 18px;\n    padding: 18px 18px 20px;\n    border-radius: 18px;\n    background: rgba(0,0,0,0.18);\n    border: 1px solid rgba(255,255,255,0.08);\n}\n\n#feedback h3 {\n    margin: 0 0 8px;\n    color: #ffe7a1;\n}\n\n.action-row {\n    display: flex;\n    justify-content: flex-end;\n    margin-top: 18px;\n}\n\n.action-btn {\n    padding: 14px 20px;\n    font-weight: 800;\n    letter-spacing: 0.3px;\n    color: #29171f;\n    background: linear-gradient(180deg, #f2d78b, #e5be62);\n    box-shadow: 0 8px 18px rgba(0,0,0,0.25);\n}\n\n.action-btn:hover {\n    transform: translateY(-1px);\n}\n\n.secondary-btn {\n    padding: 14px 20px;\n    font-weight: 800;\n    color: white;\n    background: linear-gradient(180deg, #922847, #7a1f36);\n    box-shadow: 0 8px 18px rgba(0,0,0,0.25);\n}\n\n.hidden { display: none; }\n\n.finish-panel h2 {\n    margin-top: 0;\n    font-size: 2rem;\n}\n\n.score-burst {\n    display: inline-block;\n    margin: 6px 0 16px;\n    padding: 10px 16px;\n    border-radius: 999px;\n    background: rgba(255,255,255,0.08);\n    border: 1px solid rgba(255,255,255,0.12);\n    color: #ffe7a1;\n    font-weight: 700;\n}\n\n.finish-grid {\n    display: grid;\n    grid-template-columns: 1fr;\n    gap: 20px;\n    align-items: start;\n}\n\n.identity-note {\n    padding: 18px;\n    border-radius: 18px;\n    background: rgba(0,0,0,0.16);\n    border: 1px solid rgba(255,255,255,0.08);\n    color: var(--grey-1);\n    line-height: 1.65;\n}\n\n.footer-tag {\n    text-align: center;\n    color: var(--grey-2);\n    font-size: 0.88rem;\n    padding-top: 16px;\n}\n\n.sparkle {\n    display: inline-block;\n    color: #ffe7a1;\n    text-shadow: 0 0 10px rgba(255,231,161,0.35);\n}\n\n@media (max-width: 760px) {\n    .choices,\n    .finish-grid {\n        grid-template-columns: 1fr;\n    }\n\n    .hero,\n    .panel {\n        padding: 20px;\n        border-radius: 22px;\n    }\n\n    .badge {\n        width: 78px;\n        height: 78px;\n        border-radius: 20px;\n        font-size: 1.7rem;\n    }\n}\n<\/style>\n<\/head>\n<body>\n<main>\n    <section class=\"hero\">\n        <div class=\"brand-row\">\n            <div class=\"badge\" aria-hidden=\"true\">✦<\/div>\n            <div>\n                <h1>Parallelism Puzzle<\/h1>\n                <p class=\"subtitle\">Choose the phrase that makes each sentence flow. Find the matching structure and sharpen your writing.<\/p>\n            <\/div>\n        <\/div>\n\n    <\/section>\n\n    <section class=\"panel\" id=\"game\">\n        <div class=\"stats\">\n            <div class=\"stats-card\" id=\"counter\"><\/div>\n            <div class=\"stats-card\" id=\"score\"><\/div>\n        <\/div>\n\n        <div class=\"progress\"><div id=\"bar\"><\/div><\/div>\n        <span class=\"section-label\">Choose the most parallel option<\/span>\n        <div id=\"sentence\"><\/div>\n        <div id=\"choices\" class=\"choices\"><\/div>\n\n        <div id=\"feedback\" class=\"hidden\">\n            <h3 id=\"result\"><\/h3>\n            <p id=\"explanation\"><\/p>\n        <\/div>\n\n        <div class=\"action-row\">\n            <button id=\"next\" class=\"action-btn hidden\" onclick=\"nextQuestion()\">Next Question<\/button>\n        <\/div>\n    <\/section>\n\n    <section class=\"panel finish-panel hidden\" id=\"finish\">\n        <div class=\"finish-grid\">\n            <div>\n                <h2>Round Complete <span class=\"sparkle\">✦<\/span><\/h2>\n                <div class=\"score-burst\" id=\"finalScore\"><\/div>\n                <p>Keep practising to make your sentences clearer, smoother, and easier to follow.<\/p>\n                <button class=\"secondary-btn\" onclick=\"startGame()\">Play Again<\/button>\n            <\/div>\n\n        <\/div>\n    <\/section>\n\n\n<\/main>\n\n<script>\nconst questions = [\n    {\n        before: \"Our team wanted to win the tournament, \",\n        after: \", and celebrate with the whole school.\",\n        choices: [\n            \"practising every evening\",\n            \"to practise every evening\",\n            \"practice every evening\",\n            \"evening practices\"\n        ],\n        answer: 1,\n        explanation: \"'To win,' 'to practise,' and 'to celebrate' all use matching infinitive forms.\"\n    },\n    {\n        before: \"The student council planned spirit week by designing posters, \",\n        after: \", and organizing the pep rally.\",\n        choices: [\n            \"contacting local sponsors\",\n            \"to contact local sponsors\",\n            \"local sponsors were contacted\",\n            \"contacts with local sponsors\"\n        ],\n        answer: 0,\n        explanation: \"Designing, contacting, and organizing are parallel -ing verbs.\"\n    },\n    {\n        before: \"The streamer was known for being funny, \",\n        after: \", and surprisingly thoughtful.\",\n        choices: [\n            \"creativity\",\n            \"to create\",\n            \"creative\",\n            \"creating\"\n        ],\n        answer: 2,\n        explanation: \"Funny, creative, and thoughtful are matching adjectives.\"\n    },\n    {\n        before: \"For the road trip, we packed hoodies, snacks, \",\n        after: \", and a speaker.\",\n        choices: [\n            \"charging our phones\",\n            \"extra phone chargers\",\n            \"to charge our phones\",\n            \"our phones were charged\"\n        ],\n        answer: 1,\n        explanation: \"Hoodies, snacks, chargers, and a speaker are all noun phrases.\"\n    },\n    {\n        before: \"A strong lab report should explain the results clearly, \",\n        after: \", and connect the findings to the hypothesis.\",\n        choices: [\n            \"using proper labels\",\n            \"proper labels\",\n            \"to use proper labels\",\n            \"use proper labels\"\n        ],\n        answer: 2,\n        explanation: \"Explain, use, and connect are all parallel infinitive structures after 'should.'\"\n    },\n    {\n        before: \"The part-time job taught me how to manage my time, \",\n        after: \", and stay calm under pressure.\",\n        choices: [\n            \"communicating with customers\",\n            \"customer communication\",\n            \"to communicate with customers\",\n            \"communication with customers\"\n        ],\n        answer: 2,\n        explanation: \"After 'how to,' the verbs should stay parallel: to manage, to communicate, and stay.\"\n    },\n    {\n        before: \"The coach asked us not only to trust our training \",\n        after: \".\",\n        choices: [\n            \"but also believing in each other\",\n            \"but also belief in each other\",\n            \"but also to believe in each other\",\n            \"but each other should be believed in\"\n        ],\n        answer: 2,\n        explanation: \"'Not only to trust' pairs correctly with 'but also to believe.'\"\n    },\n    {\n        before: \"Good group-chat etiquette means replying respectfully, \",\n        after: \", and keeping drama out of the conversation.\",\n        choices: [\n            \"avoiding spam messages\",\n            \"to avoid spam messages\",\n            \"spam messages should be avoided\",\n            \"avoidance of spam messages\"\n        ],\n        answer: 0,\n        explanation: \"Replying, avoiding, and keeping all use matching -ing forms.\"\n    },\n    {\n        before: \"The horror movie was both \",\n        after: \" and unexpectedly hilarious.\",\n        choices: [\n            \"suspense\",\n            \"suspenseful\",\n            \"to create suspense\",\n            \"suspense was everywhere\"\n        ],\n        answer: 1,\n        explanation: \"'Both ... and' should join matching adjectives: suspenseful and hilarious.\"\n    },\n    {\n        before: \"To survive the zombie outbreak, we would barricade the doors, \",\n        after: \", and ration the snacks.\",\n        choices: [\n            \"finding an escape route\",\n            \"to find an escape route\",\n            \"find an escape route\",\n            \"an escape route would be found\"\n        ],\n        answer: 2,\n        explanation: \"Would barricade, find, and ration create a parallel series of base-form verbs.\"\n    },\n    {\n        before: \"The gaming setup included a monitor, \",\n        after: \", and a mechanical keyboard.\",\n        choices: [\n            \"good lighting\",\n            \"lighting things well\",\n            \"to light the room\",\n            \"the room was well lit\"\n        ],\n        answer: 0,\n        explanation: \"Monitor, lighting, and keyboard all work as parallel noun phrases in the list.\"\n    },\n    {\n        before: \"The principal encouraged students to ask questions, \",\n        after: \", and to support one another.\",\n        choices: [\n            \"taking academic risks\",\n            \"to take academic risks\",\n            \"academic risk-taking\",\n            \"they should take academic risks\"\n        ],\n        answer: 1,\n        explanation: \"To ask, to take, and to support are parallel infinitives.\"\n    },\n    {\n        before: \"The playlist was perfect for studying because it was calm, \",\n        after: \", and free of distracting lyrics.\",\n        choices: [\n            \"focus\",\n            \"focusing\",\n            \"focused\",\n            \"to focus\"\n        ],\n        answer: 2,\n        explanation: \"Calm, focused, and free of distracting lyrics are all adjectives/descriptive phrases.\"\n    },\n    {\n        before: \"At the fundraiser, volunteers served hot chocolate, sold tickets, \",\n        after: \".\",\n        choices: [\n            \"and decorating the gym\",\n            \"and decorated the gym\",\n            \"and to decorate the gym\",\n            \"and decoration of the gym\"\n        ],\n        answer: 1,\n        explanation: \"Served, sold, and decorated are matching past-tense verbs.\"\n    },\n    {\n        before: \"A good caption can make a post more memorable, \",\n        after: \", and easier to share.\",\n        choices: [\n            \"humour\",\n            \"being funny\",\n            \"funny\",\n            \"to be funny\"\n        ],\n        answer: 2,\n        explanation: \"More memorable, funny, and easier to share function as matching descriptive elements.\"\n    },\n    {\n        before: \"The science fair rewarded creativity, \",\n        after: \", and persistence.\",\n        choices: [\n            \"problem-solving\",\n            \"solve problems\",\n            \"to solve problems\",\n            \"students who solve problems\"\n        ],\n        answer: 0,\n        explanation: \"Creativity, problem-solving, and persistence are all nouns/gerund-nouns in a parallel list.\"\n    }\n];\n\nlet round = [];\nlet index = 0;\nlet score = 0;\nconst roundSize = 8;\n\nfunction shuffle(array) {\n    return [...array].sort(() => Math.random() - 0.5);\n}\n\nfunction startGame() {\n    round = shuffle(questions).slice(0, roundSize);\n    index = 0;\n    score = 0;\n    document.getElementById('game').classList.remove('hidden');\n    document.getElementById('finish').classList.add('hidden');\n    showQuestion();\n}\n\nfunction showQuestion() {\n    const q = round[index];\n    document.getElementById('counter').textContent = `Question ${index + 1} of ${round.length}`;\n    document.getElementById('score').textContent = `Score: ${score}`;\n    document.getElementById('bar').style.width = `${(index / round.length) * 100}%`;\n    document.getElementById('sentence').innerHTML =\n        q.before + '<span class=\"blank\">__________<\/span>' + q.after;\n    document.getElementById('feedback').classList.add('hidden');\n    document.getElementById('next').classList.add('hidden');\n\n    const area = document.getElementById('choices');\n    area.innerHTML = '';\n\n    const options = shuffle(q.choices.map((text, i) => ({\n        text: text,\n        correct: i === q.answer\n    })));\n\n    options.forEach(option => {\n        const button = document.createElement('button');\n        button.className = 'choice';\n        button.textContent = option.text;\n        button.onclick = () => checkAnswer(option, button);\n        area.appendChild(button);\n    });\n}\n\nfunction checkAnswer(option, clickedButton) {\n    const q = round[index];\n    const buttons = document.querySelectorAll('.choice');\n\n    buttons.forEach(button => {\n        button.disabled = true;\n        if (button.textContent === q.choices[q.answer]) {\n            button.classList.add('correct');\n        }\n    });\n\n    if (option.correct) {\n        score++;\n    } else {\n        clickedButton.classList.add('wrong');\n    }\n\n    document.getElementById('score').textContent = `Score: ${score}`;\n    document.getElementById('sentence').innerHTML =\n        q.before + '<span class=\"blank\">' + q.choices[q.answer] + '<\/span>' + q.after;\n    document.getElementById('result').textContent = option.correct ? 'Correct!' : 'Not quite!';\n    document.getElementById('explanation').textContent = q.explanation;\n    document.getElementById('feedback').classList.remove('hidden');\n    document.getElementById('next').classList.remove('hidden');\n    document.getElementById('next').textContent =\n        index === round.length - 1 ? 'View Results' : 'Next Question';\n}\n\nfunction nextQuestion() {\n    index++;\n    if (index < round.length) {\n        showQuestion();\n    } else {\n        document.getElementById('game').classList.add('hidden');\n        document.getElementById('finish').classList.remove('hidden');\n        document.getElementById('finalScore').textContent = `You scored ${score} out of ${round.length}.`;\n    }\n}\n\nstartGame();\n<\/script>\n<script>\n(function(){\n  const report = () => {\n    const root = document.documentElement;\n    const body = document.body;\n    const height = Math.max(root.scrollHeight,body.scrollHeight,root.offsetHeight,body.offsetHeight);\n    parent.postMessage({kind:'coherence-frame-height', index:0, height}, '*');\n  };\n  addEventListener('load', report);\n  new ResizeObserver(report).observe(document.body);\n  new MutationObserver(report).observe(document.body, {subtree:true,childList:true,attributes:true,characterData:true});\n  report();\n})();\n<\/script>\n<\/body>\n<\/html>\n", "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Transition Junction<\/title>\n<style>\n:root {\n    --bg1: #171517;\n    --bg2: #231f23;\n    --panel: rgba(62, 56, 62, 0.92);\n    --panel-2: rgba(79, 71, 78, 0.95);\n    --maroon: #7a1f36;\n    --maroon-2: #922847;\n    --maroon-soft: #b14d6c;\n    --grey-1: #d5d0d4;\n    --grey-2: #aaa1a8;\n    --grey-3: #786f77;\n    --text: #f5f1f4;\n    --muted: #d2c5ce;\n    --gold: #e2c77a;\n    --success: #1f704e;\n    --danger: #7b3240;\n    --shadow: rgba(0,0,0,0.35);\n}\n\n* { box-sizing: border-box; }\n\nhtml, body {\n    margin: 0;\n    min-height: 100%;\n    font-family: \"Trebuchet MS\", \"Segoe UI\", Arial, sans-serif;\n    color: var(--text);\n    background:\n        radial-gradient(circle at 15% 20%, rgba(255,255,255,0.08) 0 2px, transparent 2px 100%),\n        radial-gradient(circle at 80% 10%, rgba(255,255,255,0.07) 0 1.5px, transparent 1.5px 100%),\n        radial-gradient(circle at 70% 70%, rgba(255,255,255,0.05) 0 2px, transparent 2px 100%),\n        linear-gradient(145deg, #1a171a 0%, #241d22 45%, #161518 100%);\n    background-size: 260px 260px, 320px 320px, 240px 240px, auto;\n}\n\nbody::before,\nbody::after {\n    content: \"\";\n    position: fixed;\n    pointer-events: none;\n    inset: 0;\n    z-index: 0;\n}\n\nbody::before {\n    background:\n        radial-gradient(circle at 10% 15%, rgba(226,199,122,0.16), transparent 18%),\n        radial-gradient(circle at 85% 18%, rgba(177,77,108,0.18), transparent 22%),\n        radial-gradient(circle at 30% 88%, rgba(255,255,255,0.05), transparent 18%),\n        radial-gradient(circle at 78% 80%, rgba(122,31,54,0.22), transparent 20%);\n}\n\nbody::after {\n    opacity: 0.3;\n    background-image:\n        linear-gradient(120deg, transparent 0 48%, rgba(255,255,255,0.08) 49%, transparent 50% 100%),\n        linear-gradient(45deg, transparent 0 47.5%, rgba(255,255,255,0.04) 48%, transparent 49% 100%);\n    background-size: 180px 180px, 240px 240px;\n}\n\nmain {\n    position: relative;\n    z-index: 1;\n    max-width: 980px;\n    margin: 0 auto;\n    padding: 28px 18px 50px;\n}\n\n.hero {\n    position: relative;\n    overflow: hidden;\n    padding: 28px 28px 24px;\n    margin-bottom: 22px;\n    border-radius: 28px;\n    background:\n        linear-gradient(155deg, rgba(122,31,54,0.92), rgba(66,54,63,0.96) 55%, rgba(32,29,33,0.95));\n    border: 1px solid rgba(255,255,255,0.14);\n    box-shadow:\n        0 18px 40px var(--shadow),\n        inset 0 1px 0 rgba(255,255,255,0.18),\n        inset 0 0 0 2px rgba(255,255,255,0.04);\n}\n\n.hero::before {\n    content: \"\";\n    position: absolute;\n    inset: auto -10% -30% auto;\n    width: 240px;\n    height: 240px;\n    border-radius: 50%;\n    background: radial-gradient(circle, rgba(255,255,255,0.12), transparent 65%);\n}\n\n.hero::after {\n    content: \"✦  ✧  ✦\";\n    position: absolute;\n    top: 18px;\n    right: 22px;\n    letter-spacing: 8px;\n    color: rgba(255,255,255,0.55);\n    font-size: 1.15rem;\n}\n\n.brand-row {\n    display: flex;\n    gap: 18px;\n    align-items: center;\n    flex-wrap: wrap;\n}\n\n.badge {\n    width: 94px;\n    height: 94px;\n    flex: 0 0 auto;\n    border-radius: 24px;\n    display: grid;\n    place-items: center;\n    background:\n        radial-gradient(circle at 35% 30%, rgba(255,255,255,0.35), rgba(255,255,255,0.08) 18%, transparent 19%),\n        radial-gradient(circle at 65% 60%, rgba(255,255,255,0.28), rgba(255,255,255,0.05) 16%, transparent 17%),\n        linear-gradient(145deg, #9f5d73, #7a1f36 48%, #4e3944 100%);\n    border: 1px solid rgba(255,255,255,0.22);\n    box-shadow:\n        inset 0 1px 0 rgba(255,255,255,0.28),\n        0 8px 18px rgba(0,0,0,0.28);\n    color: white;\n    font-size: 2rem;\n    text-shadow: 0 0 10px rgba(255,255,255,0.35);\n}\n\n.overline {\n    text-transform: uppercase;\n    letter-spacing: 2.6px;\n    color: var(--gold);\n    font-size: 0.78rem;\n    margin: 0 0 6px;\n}\n\nh1 {\n    margin: 0;\n    font-size: clamp(2rem, 4vw, 3rem);\n    line-height: 1.03;\n}\n\n.subtitle {\n    margin: 10px 0 0;\n    max-width: 760px;\n    color: var(--grey-1);\n    line-height: 1.65;\n    font-size: 1.03rem;\n}\n\n.chips {\n    display: flex;\n    flex-wrap: wrap;\n    gap: 10px;\n    margin-top: 18px;\n}\n\n.chip {\n    padding: 8px 14px;\n    border-radius: 999px;\n    background: rgba(255,255,255,0.09);\n    border: 1px solid rgba(255,255,255,0.12);\n    color: var(--grey-1);\n    font-size: 0.92rem;\n    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);\n}\n\n.panel {\n    position: relative;\n    overflow: hidden;\n    background:\n        linear-gradient(180deg, rgba(77,69,76,0.96), rgba(50,45,51,0.97));\n    border: 1px solid rgba(255,255,255,0.12);\n    border-radius: 24px;\n    padding: 24px;\n    box-shadow:\n        0 16px 34px rgba(0,0,0,0.28),\n        inset 0 1px 0 rgba(255,255,255,0.12);\n}\n\n.panel::before {\n    content: \"\";\n    position: absolute;\n    inset: 0;\n    pointer-events: none;\n    background:\n        linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent),\n        radial-gradient(circle at 92% 8%, rgba(255,255,255,0.14) 0 2px, transparent 3px),\n        radial-gradient(circle at 88% 12%, rgba(255,255,255,0.09) 0 1.8px, transparent 2.8px),\n        radial-gradient(circle at 94% 15%, rgba(255,255,255,0.07) 0 1.3px, transparent 2.4px);\n}\n\n.stats {\n    display: flex;\n    justify-content: space-between;\n    gap: 10px;\n    flex-wrap: wrap;\n    color: var(--grey-1);\n    font-weight: 700;\n}\n\n.stats-card {\n    padding: 10px 14px;\n    background: rgba(0,0,0,0.18);\n    border: 1px solid rgba(255,255,255,0.09);\n    border-radius: 14px;\n    min-width: 150px;\n}\n\n.progress {\n    height: 14px;\n    border-radius: 999px;\n    margin: 18px 0 6px;\n    padding: 2px;\n    background: rgba(15,12,15,0.45);\n    border: 1px solid rgba(255,255,255,0.06);\n}\n\n#bar {\n    width: 0%;\n    height: 100%;\n    border-radius: inherit;\n    background:\n        linear-gradient(90deg, #b24f6e, #e2c77a 55%, #f8e9ba 100%);\n    box-shadow: 0 0 14px rgba(226,199,122,0.5);\n    transition: width 0.35s ease;\n}\n\n.section-label {\n    display: inline-block;\n    margin-top: 14px;\n    font-size: 0.8rem;\n    text-transform: uppercase;\n    letter-spacing: 2px;\n    color: var(--gold);\n}\n\n#sentence {\n    margin: 18px 0 24px;\n    font-size: clamp(1.3rem, 2.4vw, 1.72rem);\n    line-height: 1.7;\n    color: #fffafc;\n}\n\n.blank {\n    color: #ffe9a8;\n    font-weight: 700;\n    border-bottom: 3px dashed rgba(255,233,168,0.9);\n    padding-bottom: 2px;\n}\n\n.choices {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 14px;\n}\n\nbutton {\n    font: inherit;\n    cursor: pointer;\n    border: none;\n    border-radius: 16px;\n    transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;\n}\n\n.choice {\n    position: relative;\n    text-align: left;\n    padding: 16px 18px 16px 50px;\n    color: var(--text);\n    background:\n        linear-gradient(180deg, rgba(126,112,122,0.23), rgba(58,50,57,0.58)),\n        linear-gradient(145deg, rgba(255,255,255,0.04), rgba(255,255,255,0));\n    border: 1px solid rgba(255,255,255,0.13);\n    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);\n    min-height: 76px;\n}\n\n.choice::before {\n    content: \"✦\";\n    position: absolute;\n    left: 18px;\n    top: 50%;\n    transform: translateY(-50%);\n    color: rgba(255,255,255,0.58);\n    font-size: 1rem;\n}\n\n.choice:hover:not(:disabled) {\n    transform: translateY(-1px);\n    background:\n        linear-gradient(180deg, rgba(164,91,118,0.35), rgba(70,58,66,0.76));\n    box-shadow:\n        0 10px 20px rgba(0,0,0,0.18),\n        0 0 0 1px rgba(255,255,255,0.07) inset;\n}\n\n.choice:disabled {\n    cursor: default;\n}\n\n.choice.correct {\n    background: linear-gradient(180deg, rgba(53,129,95,0.92), rgba(26,91,66,0.96));\n    border-color: rgba(184,244,220,0.45);\n}\n\n.choice.wrong {\n    background: linear-gradient(180deg, rgba(142,62,82,0.95), rgba(110,44,60,0.98));\n    border-color: rgba(255,196,207,0.35);\n}\n\n#feedback {\n    margin-top: 18px;\n    padding: 18px 18px 20px;\n    border-radius: 18px;\n    background: rgba(0,0,0,0.18);\n    border: 1px solid rgba(255,255,255,0.08);\n}\n\n#feedback h3 {\n    margin: 0 0 8px;\n    color: #ffe7a1;\n}\n\n.action-row {\n    display: flex;\n    justify-content: flex-end;\n    margin-top: 18px;\n}\n\n.action-btn {\n    padding: 14px 20px;\n    font-weight: 800;\n    letter-spacing: 0.3px;\n    color: #29171f;\n    background: linear-gradient(180deg, #f2d78b, #e5be62);\n    box-shadow: 0 8px 18px rgba(0,0,0,0.25);\n}\n\n.action-btn:hover {\n    transform: translateY(-1px);\n}\n\n.secondary-btn {\n    padding: 14px 20px;\n    font-weight: 800;\n    color: white;\n    background: linear-gradient(180deg, #922847, #7a1f36);\n    box-shadow: 0 8px 18px rgba(0,0,0,0.25);\n}\n\n.hidden { display: none; }\n\n.finish-panel h2 {\n    margin-top: 0;\n    font-size: 2rem;\n}\n\n.score-burst {\n    display: inline-block;\n    margin: 6px 0 16px;\n    padding: 10px 16px;\n    border-radius: 999px;\n    background: rgba(255,255,255,0.08);\n    border: 1px solid rgba(255,255,255,0.12);\n    color: #ffe7a1;\n    font-weight: 700;\n}\n\n.finish-grid {\n    display: grid;\n    grid-template-columns: 1fr;\n    gap: 20px;\n    align-items: start;\n}\n\n.identity-note {\n    padding: 18px;\n    border-radius: 18px;\n    background: rgba(0,0,0,0.16);\n    border: 1px solid rgba(255,255,255,0.08);\n    color: var(--grey-1);\n    line-height: 1.65;\n}\n\n.footer-tag {\n    text-align: center;\n    color: var(--grey-2);\n    font-size: 0.88rem;\n    padding-top: 16px;\n}\n\n.sparkle {\n    display: inline-block;\n    color: #ffe7a1;\n    text-shadow: 0 0 10px rgba(255,231,161,0.35);\n}\n\n@media (max-width: 760px) {\n    .choices,\n    .finish-grid {\n        grid-template-columns: 1fr;\n    }\n\n    .hero,\n    .panel {\n        padding: 20px;\n        border-radius: 22px;\n    }\n\n    .badge {\n        width: 78px;\n        height: 78px;\n        border-radius: 20px;\n        font-size: 1.7rem;\n    }\n}\n\n/* Transition Junction: sentence bridges */\n.bridge-layout {display:grid;grid-template-columns:1fr;gap:0;margin:18px 0 22px;}\n.idea {position:relative;background:rgba(16,14,17,.3);padding:20px 22px;border:1px solid rgba(255,255,255,.12);border-radius:17px;}\n.idea-label {font-size:.72rem;letter-spacing:1.9px;text-transform:uppercase;color:var(--gold);font-weight:bold;margin-bottom:7px;}\n.idea-text {font-size:clamp(1.12rem,2.5vw,1.45rem);line-height:1.6;}\n.connector {align-self:center;text-align:center;padding:12px 0;position:relative;z-index:1;}\n.connector:before {content:\"\";position:absolute;top:0;bottom:0;left:50%;width:2px;transform:translateX(-50%);background:linear-gradient(var(--maroon-soft),var(--gold));z-index:-1;}\n.connector span {display:inline-block;border:1px solid rgba(242,215,139,.5);background:linear-gradient(145deg,#7b2946,#3b343b);border-radius:100px;padding:9px 22px;color:#fff0c1;font-weight:800;box-shadow:0 0 18px rgba(226,199,122,.15);}\n.connector span.pending {color:#c3b7c0;border-style:dashed;border-color:rgba(255,255,255,.25);background:#312b31;}\n.choice {padding-left:18px;min-height:64px;text-align:center;font-weight:700;}\n.choice::before {content:none;}\n#feedback p {line-height:1.6;margin-bottom:0;}\n.answer-note {font-size:.91rem;color:#d5cbd1;margin-top:14px;}\n.relationship {color:#f5dc9e;font-weight:bold;letter-spacing:.3px;}\n@media (prefers-reduced-motion:reduce) {*,*::before,*::after {transition:none!important;animation:none!important;}}\n<\/style>\n<\/head>\n<body>\n<main>\n<section class=\"hero\"><div class=\"brand-row\"><div class=\"badge\" aria-hidden=\"true\">✦<\/div><div><h1>Transition Junction<\/h1><p class=\"subtitle\">Two ideas. One connection. Choose the transition that makes the meaning click.<\/p><\/div><\/div><\/section>\n<section class=\"panel\" id=\"game\">\n<div class=\"stats\"><div class=\"stats-card\" id=\"counter\"><\/div><div class=\"stats-card\" id=\"score\"><\/div><\/div>\n<div class=\"progress\"><div id=\"bar\"><\/div><\/div>\n<span class=\"section-label\">Build the bridge between these ideas<\/span>\n<div class=\"bridge-layout\">\n <div class=\"idea\"><div class=\"idea-label\">First idea<\/div><div class=\"idea-text\" id=\"first\"><\/div><\/div>\n <div class=\"connector\"><span id=\"bridge\" class=\"pending\">Choose a transition<\/span><\/div>\n <div class=\"idea\"><div class=\"idea-label\">Second idea<\/div><div class=\"idea-text\" id=\"second\"><\/div><\/div>\n<\/div>\n<div id=\"choices\" class=\"choices\"><\/div>\n<div id=\"feedback\" class=\"hidden\" aria-live=\"polite\"><h3 id=\"result\"><\/h3><div class=\"relationship\" id=\"relationship\"><\/div><p id=\"explanation\"><\/p><\/div>\n<div class=\"action-row\"><button id=\"next\" class=\"action-btn hidden\" onclick=\"nextQuestion()\">Next Question<\/button><\/div>\n<\/section>\n<section class=\"panel finish-panel hidden\" id=\"finish\"><h2>Connections Made <span class=\"sparkle\">✦<\/span><\/h2><div class=\"score-burst\" id=\"finalScore\"><\/div><p>Try another round to practise different transitions and relationships between ideas.<\/p><button class=\"secondary-btn\" onclick=\"startGame()\">Play Again<\/button><\/section>\n<\/main>\n<script>\nconst questions = [\n  {\n    \"first\": \"The school announced that phones would be permitted during lunch.\",\n    \"second\": \"Students would still have to put them away during class.\",\n    \"answer\": \"However\",\n    \"relation\": \"Contrast\",\n    \"explanation\": \"The second sentence introduces a restriction that contrasts with the new permission.\",\n    \"choices\": [\n      \"However\",\n      \"Therefore\",\n      \"Furthermore\",\n      \"For example\"\n    ]\n  },\n  {\n    \"first\": \"The storm knocked out the power just before the hockey game.\",\n    \"second\": \"The arena had to postpone the opening faceoff.\",\n    \"answer\": \"Consequently\",\n    \"relation\": \"Cause and effect\",\n    \"explanation\": \"The power outage caused the delay. “Consequently” signals that result.\",\n    \"choices\": [\n      \"Consequently\",\n      \"Similarly\",\n      \"Nevertheless\",\n      \"For instance\"\n    ]\n  },\n  {\n    \"first\": \"The student council sold out every ticket for the winter dance.\",\n    \"second\": \"They added a second event for students who missed out.\",\n    \"answer\": \"As a result\",\n    \"relation\": \"Cause and effect\",\n    \"explanation\": \"The sellout led to the decision to add another event.\",\n    \"choices\": [\n      \"As a result\",\n      \"In contrast\",\n      \"For example\",\n      \"Meanwhile\"\n    ]\n  },\n  {\n    \"first\": \"The school musical needed actors for its lead roles.\",\n    \"second\": \"It also needed students to work on lighting and sound.\",\n    \"answer\": \"In addition\",\n    \"relation\": \"Addition\",\n    \"explanation\": \"The second sentence adds another requirement for the same production.\",\n    \"choices\": [\n      \"In addition\",\n      \"Instead\",\n      \"Nevertheless\",\n      \"As a result\"\n    ]\n  },\n  {\n    \"first\": \"Jordan practised the guitar solo every evening for a month.\",\n    \"second\": \"The performance still went badly when the amplifier stopped working.\",\n    \"answer\": \"Nevertheless\",\n    \"relation\": \"Contrast\",\n    \"explanation\": \"“Nevertheless” highlights the unexpected poor outcome despite careful practice.\",\n    \"choices\": [\n      \"Nevertheless\",\n      \"Consequently\",\n      \"For instance\",\n      \"Similarly\"\n    ]\n  },\n  {\n    \"first\": \"Many students use AI tools to brainstorm assignment topics.\",\n    \"second\": \"Some use them to help organize their notes before writing.\",\n    \"answer\": \"Similarly\",\n    \"relation\": \"Similarity\",\n    \"explanation\": \"Both sentences describe related ways students use the tools.\",\n    \"choices\": [\n      \"Similarly\",\n      \"However\",\n      \"Consequently\",\n      \"For example\"\n    ]\n  },\n  {\n    \"first\": \"The class first tested its bridge design with a small load.\",\n    \"second\": \"They increased the weight until the bridge failed.\",\n    \"answer\": \"Next\",\n    \"relation\": \"Sequence\",\n    \"explanation\": \"“Next” indicates the next stage in the testing procedure.\",\n    \"choices\": [\n      \"Next\",\n      \"Nevertheless\",\n      \"For example\",\n      \"In contrast\"\n    ]\n  },\n  {\n    \"first\": \"Some online challenges encourage dangerous behaviour.\",\n    \"second\": \"A viral trend that asks people to jump from moving vehicles is one example.\",\n    \"answer\": \"For instance\",\n    \"relation\": \"Example\",\n    \"explanation\": \"The second sentence gives a specific example of the danger described in the first.\",\n    \"choices\": [\n      \"For instance\",\n      \"Therefore\",\n      \"Meanwhile\",\n      \"On the other hand\"\n    ]\n  },\n  {\n    \"first\": \"The cafeteria introduced a vegetarian lunch option.\",\n    \"second\": \"It began offering more meals that accommodate food allergies.\",\n    \"answer\": \"Furthermore\",\n    \"relation\": \"Addition\",\n    \"explanation\": \"The second sentence adds another improvement to the cafeteria menu.\",\n    \"choices\": [\n      \"Furthermore\",\n      \"Instead\",\n      \"Consequently\",\n      \"Nevertheless\"\n    ]\n  },\n  {\n    \"first\": \"The goalie made a spectacular save in the final minute.\",\n    \"second\": \"The opposing team scored on the rebound.\",\n    \"answer\": \"However\",\n    \"relation\": \"Contrast\",\n    \"explanation\": \"The follow-up event goes against the expectation created by the save.\",\n    \"choices\": [\n      \"However\",\n      \"For example\",\n      \"Therefore\",\n      \"Likewise\"\n    ]\n  },\n  {\n    \"first\": \"The bus broke down on the way to the debate competition.\",\n    \"second\": \"The team arrived after the first round had started.\",\n    \"answer\": \"As a result\",\n    \"relation\": \"Cause and effect\",\n    \"explanation\": \"The late arrival was a result of the bus breaking down.\",\n    \"choices\": [\n      \"As a result\",\n      \"In addition\",\n      \"For example\",\n      \"Conversely\"\n    ]\n  },\n  {\n    \"first\": \"The art class sketched their mural ideas on paper.\",\n    \"second\": \"They transferred their chosen design onto the wall.\",\n    \"answer\": \"Afterward\",\n    \"relation\": \"Sequence\",\n    \"explanation\": \"The second action happens after the initial sketching stage.\",\n    \"choices\": [\n      \"Afterward\",\n      \"However\",\n      \"Similarly\",\n      \"For instance\"\n    ]\n  },\n  {\n    \"first\": \"Some students learn best by watching a demonstration.\",\n    \"second\": \"Others understand a skill better by trying it themselves.\",\n    \"answer\": \"On the other hand\",\n    \"relation\": \"Contrast\",\n    \"explanation\": \"The two sentences compare different learning preferences.\",\n    \"choices\": [\n      \"On the other hand\",\n      \"As a result\",\n      \"For example\",\n      \"Additionally\"\n    ]\n  },\n  {\n    \"first\": \"The fundraiser collected donations from local businesses.\",\n    \"second\": \"It raised money by selling tickets to a lunchtime concert.\",\n    \"answer\": \"Additionally\",\n    \"relation\": \"Addition\",\n    \"explanation\": \"The second sentence describes another way the fundraiser brought in money.\",\n    \"choices\": [\n      \"Additionally\",\n      \"Nevertheless\",\n      \"Consequently\",\n      \"Instead\"\n    ]\n  },\n  {\n    \"first\": \"The basketball team struggled to score in the first half.\",\n    \"second\": \"They changed their strategy during halftime.\",\n    \"answer\": \"Therefore\",\n    \"relation\": \"Cause and effect\",\n    \"explanation\": \"The difficulty scoring motivated the strategic change.\",\n    \"choices\": [\n      \"Therefore\",\n      \"For instance\",\n      \"Meanwhile\",\n      \"Likewise\"\n    ]\n  },\n  {\n    \"first\": \"The principal asked students to cut down on single-use plastics.\",\n    \"second\": \"Students could bring reusable water bottles to school.\",\n    \"answer\": \"For example\",\n    \"relation\": \"Example\",\n    \"explanation\": \"The second sentence offers a concrete action students could take.\",\n    \"choices\": [\n      \"For example\",\n      \"However\",\n      \"Consequently\",\n      \"Similarly\"\n    ]\n  },\n  {\n    \"first\": \"The robotics team finished building its machine on Friday.\",\n    \"second\": \"They spent Saturday checking its sensors and calibrating its motors.\",\n    \"answer\": \"Then\",\n    \"relation\": \"Sequence\",\n    \"explanation\": \"The second sentence describes what happened after the build was finished.\",\n    \"choices\": [\n      \"Then\",\n      \"However\",\n      \"For example\",\n      \"Likewise\"\n    ]\n  },\n  {\n    \"first\": \"A student uploaded a funny video of the school mascot.\",\n    \"second\": \"The clip received thousands of views overnight.\",\n    \"answer\": \"Soon afterward\",\n    \"relation\": \"Sequence\",\n    \"explanation\": \"The view count increased shortly after the video was posted.\",\n    \"choices\": [\n      \"Soon afterward\",\n      \"Nevertheless\",\n      \"In contrast\",\n      \"For example\"\n    ]\n  },\n  {\n    \"first\": \"The concert was scheduled to start at seven.\",\n    \"second\": \"The opening band did not take the stage until eight.\",\n    \"answer\": \"Instead\",\n    \"relation\": \"Contrast\",\n    \"explanation\": \"“Instead” indicates that what actually happened differed from the plan.\",\n    \"choices\": [\n      \"Instead\",\n      \"In addition\",\n      \"As a result\",\n      \"For example\"\n    ]\n  },\n  {\n    \"first\": \"The group chat was becoming difficult to follow.\",\n    \"second\": \"Everyone agreed to keep unrelated memes in a separate thread.\",\n    \"answer\": \"Consequently\",\n    \"relation\": \"Cause and effect\",\n    \"explanation\": \"The confusion prompted the decision to separate the conversations.\",\n    \"choices\": [\n      \"Consequently\",\n      \"For instance\",\n      \"Similarly\",\n      \"On the other hand\"\n    ]\n  }\n];\nconst roundSize = 10;\nlet round = [], index = 0, score = 0;\nfunction shuffle(array) {\n  const copy = [...array];\n  for (let i=copy.length-1;i>0;i--) {\n    const j=Math.floor(Math.random()*(i+1));\n    [copy[i],copy[j]]=[copy[j],copy[i]];\n  }\n  return copy;\n}\nfunction startGame() {\n  round=shuffle(questions).slice(0,roundSize);\n  index=0;score=0;\n  document.getElementById('game').classList.remove('hidden');\n  document.getElementById('finish').classList.add('hidden');\n  showQuestion();\n}\nfunction showQuestion() {\n  const q=round[index];\n  document.getElementById('counter').textContent=`Question ${index+1} of ${round.length}`;\n  document.getElementById('score').textContent=`Score: ${score}`;\n  document.getElementById('bar').style.width=`${index/round.length*100}%`;\n  document.getElementById('first').textContent=q.first;\n  document.getElementById('second').textContent=q.second;\n  const bridge=document.getElementById('bridge');\n  bridge.textContent='Choose a transition';bridge.classList.add('pending');\n  document.getElementById('feedback').classList.add('hidden');\n  document.getElementById('next').classList.add('hidden');\n  const area=document.getElementById('choices');area.replaceChildren();\n  for (const option of shuffle(q.choices)) {\n    const button=document.createElement('button');\n    button.className='choice';button.textContent=option;\n    button.addEventListener('click',()=>checkAnswer(option,button));\n    area.appendChild(button);\n  }\n}\nfunction checkAnswer(option,clickedButton) {\n  const q=round[index];const correct=option===q.answer;\n  if (correct) score++;\n  for (const button of document.querySelectorAll('.choice')) {\n    button.disabled=true;\n    if (button.textContent===q.answer)button.classList.add('correct');\n  }\n  if (!correct)clickedButton.classList.add('wrong');\n  document.getElementById('score').textContent=`Score: ${score}`;\n  const bridge=document.getElementById('bridge');bridge.classList.remove('pending');bridge.textContent=q.answer;\n  document.getElementById('result').textContent=correct?'That connects!':'Not quite — look at the relationship.';\n  document.getElementById('relationship').textContent=q.relation;\n  document.getElementById('explanation').textContent=q.explanation;\n  document.getElementById('feedback').classList.remove('hidden');\n  const next=document.getElementById('next');next.classList.remove('hidden');next.textContent=index===round.length-1?'View Results':'Next Question';\n  document.getElementById('bar').style.width=`${(index+1)/round.length*100}%`;\n}\nfunction nextQuestion() {\n  index++;\n  if(index<round.length){showQuestion();return;}\n  document.getElementById('game').classList.add('hidden');\n  document.getElementById('finish').classList.remove('hidden');\n  document.getElementById('finalScore').textContent=`You scored ${score} out of ${round.length}.`;\n}\nstartGame();\n<\/script>\n<script>\n(function(){\n  const report = () => {\n    const root = document.documentElement;\n    const body = document.body;\n    const height = Math.max(root.scrollHeight,body.scrollHeight,root.offsetHeight,body.offsetHeight);\n    parent.postMessage({kind:'coherence-frame-height', index:1, height}, '*');\n  };\n  addEventListener('load', report);\n  new ResizeObserver(report).observe(document.body);\n  new MutationObserver(report).observe(document.body, {subtree:true,childList:true,attributes:true,characterData:true});\n  report();\n})();\n<\/script>\n<\/body><\/html>", "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Paragraph Architect<\/title>\n<style>\n:root {\n    --bg1: #171517;\n    --bg2: #231f23;\n    --panel: rgba(62, 56, 62, 0.92);\n    --panel-2: rgba(79, 71, 78, 0.95);\n    --maroon: #7a1f36;\n    --maroon-2: #922847;\n    --maroon-soft: #b14d6c;\n    --grey-1: #d5d0d4;\n    --grey-2: #aaa1a8;\n    --grey-3: #786f77;\n    --text: #f5f1f4;\n    --muted: #d2c5ce;\n    --gold: #e2c77a;\n    --success: #1f704e;\n    --danger: #7b3240;\n    --shadow: rgba(0,0,0,0.35);\n}\n\n* { box-sizing: border-box; }\n\nhtml, body {\n    margin: 0;\n    min-height: 100%;\n    font-family: \"Trebuchet MS\", \"Segoe UI\", Arial, sans-serif;\n    color: var(--text);\n    background:\n        radial-gradient(circle at 15% 20%, rgba(255,255,255,0.08) 0 2px, transparent 2px 100%),\n        radial-gradient(circle at 80% 10%, rgba(255,255,255,0.07) 0 1.5px, transparent 1.5px 100%),\n        radial-gradient(circle at 70% 70%, rgba(255,255,255,0.05) 0 2px, transparent 2px 100%),\n        linear-gradient(145deg, #1a171a 0%, #241d22 45%, #161518 100%);\n    background-size: 260px 260px, 320px 320px, 240px 240px, auto;\n}\n\nbody::before,\nbody::after {\n    content: \"\";\n    position: fixed;\n    pointer-events: none;\n    inset: 0;\n    z-index: 0;\n}\n\nbody::before {\n    background:\n        radial-gradient(circle at 10% 15%, rgba(226,199,122,0.16), transparent 18%),\n        radial-gradient(circle at 85% 18%, rgba(177,77,108,0.18), transparent 22%),\n        radial-gradient(circle at 30% 88%, rgba(255,255,255,0.05), transparent 18%),\n        radial-gradient(circle at 78% 80%, rgba(122,31,54,0.22), transparent 20%);\n}\n\nbody::after {\n    opacity: 0.3;\n    background-image:\n        linear-gradient(120deg, transparent 0 48%, rgba(255,255,255,0.08) 49%, transparent 50% 100%),\n        linear-gradient(45deg, transparent 0 47.5%, rgba(255,255,255,0.04) 48%, transparent 49% 100%);\n    background-size: 180px 180px, 240px 240px;\n}\n\nmain {\n    position: relative;\n    z-index: 1;\n    max-width: 980px;\n    margin: 0 auto;\n    padding: 28px 18px 50px;\n}\n\n.hero {\n    position: relative;\n    overflow: hidden;\n    padding: 28px 28px 24px;\n    margin-bottom: 22px;\n    border-radius: 28px;\n    background:\n        linear-gradient(155deg, rgba(122,31,54,0.92), rgba(66,54,63,0.96) 55%, rgba(32,29,33,0.95));\n    border: 1px solid rgba(255,255,255,0.14);\n    box-shadow:\n        0 18px 40px var(--shadow),\n        inset 0 1px 0 rgba(255,255,255,0.18),\n        inset 0 0 0 2px rgba(255,255,255,0.04);\n}\n\n.hero::before {\n    content: \"\";\n    position: absolute;\n    inset: auto -10% -30% auto;\n    width: 240px;\n    height: 240px;\n    border-radius: 50%;\n    background: radial-gradient(circle, rgba(255,255,255,0.12), transparent 65%);\n}\n\n.hero::after {\n    content: \"✦  ✧  ✦\";\n    position: absolute;\n    top: 18px;\n    right: 22px;\n    letter-spacing: 8px;\n    color: rgba(255,255,255,0.55);\n    font-size: 1.15rem;\n}\n\n.brand-row {\n    display: flex;\n    gap: 18px;\n    align-items: center;\n    flex-wrap: wrap;\n}\n\n.badge {\n    width: 94px;\n    height: 94px;\n    flex: 0 0 auto;\n    border-radius: 24px;\n    display: grid;\n    place-items: center;\n    background:\n        radial-gradient(circle at 35% 30%, rgba(255,255,255,0.35), rgba(255,255,255,0.08) 18%, transparent 19%),\n        radial-gradient(circle at 65% 60%, rgba(255,255,255,0.28), rgba(255,255,255,0.05) 16%, transparent 17%),\n        linear-gradient(145deg, #9f5d73, #7a1f36 48%, #4e3944 100%);\n    border: 1px solid rgba(255,255,255,0.22);\n    box-shadow:\n        inset 0 1px 0 rgba(255,255,255,0.28),\n        0 8px 18px rgba(0,0,0,0.28);\n    color: white;\n    font-size: 2rem;\n    text-shadow: 0 0 10px rgba(255,255,255,0.35);\n}\n\n.overline {\n    text-transform: uppercase;\n    letter-spacing: 2.6px;\n    color: var(--gold);\n    font-size: 0.78rem;\n    margin: 0 0 6px;\n}\n\nh1 {\n    margin: 0;\n    font-size: clamp(2rem, 4vw, 3rem);\n    line-height: 1.03;\n}\n\n.subtitle {\n    margin: 10px 0 0;\n    max-width: 760px;\n    color: var(--grey-1);\n    line-height: 1.65;\n    font-size: 1.03rem;\n}\n\n.chips {\n    display: flex;\n    flex-wrap: wrap;\n    gap: 10px;\n    margin-top: 18px;\n}\n\n.chip {\n    padding: 8px 14px;\n    border-radius: 999px;\n    background: rgba(255,255,255,0.09);\n    border: 1px solid rgba(255,255,255,0.12);\n    color: var(--grey-1);\n    font-size: 0.92rem;\n    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);\n}\n\n.panel {\n    position: relative;\n    overflow: hidden;\n    background:\n        linear-gradient(180deg, rgba(77,69,76,0.96), rgba(50,45,51,0.97));\n    border: 1px solid rgba(255,255,255,0.12);\n    border-radius: 24px;\n    padding: 24px;\n    box-shadow:\n        0 16px 34px rgba(0,0,0,0.28),\n        inset 0 1px 0 rgba(255,255,255,0.12);\n}\n\n.panel::before {\n    content: \"\";\n    position: absolute;\n    inset: 0;\n    pointer-events: none;\n    background:\n        linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent),\n        radial-gradient(circle at 92% 8%, rgba(255,255,255,0.14) 0 2px, transparent 3px),\n        radial-gradient(circle at 88% 12%, rgba(255,255,255,0.09) 0 1.8px, transparent 2.8px),\n        radial-gradient(circle at 94% 15%, rgba(255,255,255,0.07) 0 1.3px, transparent 2.4px);\n}\n\n.stats {\n    display: flex;\n    justify-content: space-between;\n    gap: 10px;\n    flex-wrap: wrap;\n    color: var(--grey-1);\n    font-weight: 700;\n}\n\n.stats-card {\n    padding: 10px 14px;\n    background: rgba(0,0,0,0.18);\n    border: 1px solid rgba(255,255,255,0.09);\n    border-radius: 14px;\n    min-width: 150px;\n}\n\n.progress {\n    height: 14px;\n    border-radius: 999px;\n    margin: 18px 0 6px;\n    padding: 2px;\n    background: rgba(15,12,15,0.45);\n    border: 1px solid rgba(255,255,255,0.06);\n}\n\n#bar {\n    width: 0%;\n    height: 100%;\n    border-radius: inherit;\n    background:\n        linear-gradient(90deg, #b24f6e, #e2c77a 55%, #f8e9ba 100%);\n    box-shadow: 0 0 14px rgba(226,199,122,0.5);\n    transition: width 0.35s ease;\n}\n\n.section-label {\n    display: inline-block;\n    margin-top: 14px;\n    font-size: 0.8rem;\n    text-transform: uppercase;\n    letter-spacing: 2px;\n    color: var(--gold);\n}\n\n#sentence {\n    margin: 18px 0 24px;\n    font-size: clamp(1.3rem, 2.4vw, 1.72rem);\n    line-height: 1.7;\n    color: #fffafc;\n}\n\n.blank {\n    color: #ffe9a8;\n    font-weight: 700;\n    border-bottom: 3px dashed rgba(255,233,168,0.9);\n    padding-bottom: 2px;\n}\n\n.choices {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 14px;\n}\n\nbutton {\n    font: inherit;\n    cursor: pointer;\n    border: none;\n    border-radius: 16px;\n    transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;\n}\n\n.choice {\n    position: relative;\n    text-align: left;\n    padding: 16px 18px 16px 50px;\n    color: var(--text);\n    background:\n        linear-gradient(180deg, rgba(126,112,122,0.23), rgba(58,50,57,0.58)),\n        linear-gradient(145deg, rgba(255,255,255,0.04), rgba(255,255,255,0));\n    border: 1px solid rgba(255,255,255,0.13);\n    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);\n    min-height: 76px;\n}\n\n.choice::before {\n    content: \"✦\";\n    position: absolute;\n    left: 18px;\n    top: 50%;\n    transform: translateY(-50%);\n    color: rgba(255,255,255,0.58);\n    font-size: 1rem;\n}\n\n.choice:hover:not(:disabled) {\n    transform: translateY(-1px);\n    background:\n        linear-gradient(180deg, rgba(164,91,118,0.35), rgba(70,58,66,0.76));\n    box-shadow:\n        0 10px 20px rgba(0,0,0,0.18),\n        0 0 0 1px rgba(255,255,255,0.07) inset;\n}\n\n.choice:disabled {\n    cursor: default;\n}\n\n.choice.correct {\n    background: linear-gradient(180deg, rgba(53,129,95,0.92), rgba(26,91,66,0.96));\n    border-color: rgba(184,244,220,0.45);\n}\n\n.choice.wrong {\n    background: linear-gradient(180deg, rgba(142,62,82,0.95), rgba(110,44,60,0.98));\n    border-color: rgba(255,196,207,0.35);\n}\n\n#feedback {\n    margin-top: 18px;\n    padding: 18px 18px 20px;\n    border-radius: 18px;\n    background: rgba(0,0,0,0.18);\n    border: 1px solid rgba(255,255,255,0.08);\n}\n\n#feedback h3 {\n    margin: 0 0 8px;\n    color: #ffe7a1;\n}\n\n.action-row {\n    display: flex;\n    justify-content: flex-end;\n    margin-top: 18px;\n}\n\n.action-btn {\n    padding: 14px 20px;\n    font-weight: 800;\n    letter-spacing: 0.3px;\n    color: #29171f;\n    background: linear-gradient(180deg, #f2d78b, #e5be62);\n    box-shadow: 0 8px 18px rgba(0,0,0,0.25);\n}\n\n.action-btn:hover {\n    transform: translateY(-1px);\n}\n\n.secondary-btn {\n    padding: 14px 20px;\n    font-weight: 800;\n    color: white;\n    background: linear-gradient(180deg, #922847, #7a1f36);\n    box-shadow: 0 8px 18px rgba(0,0,0,0.25);\n}\n\n.hidden { display: none; }\n\n.finish-panel h2 {\n    margin-top: 0;\n    font-size: 2rem;\n}\n\n.score-burst {\n    display: inline-block;\n    margin: 6px 0 16px;\n    padding: 10px 16px;\n    border-radius: 999px;\n    background: rgba(255,255,255,0.08);\n    border: 1px solid rgba(255,255,255,0.12);\n    color: #ffe7a1;\n    font-weight: 700;\n}\n\n.finish-grid {\n    display: grid;\n    grid-template-columns: 1fr;\n    gap: 20px;\n    align-items: start;\n}\n\n.identity-note {\n    padding: 18px;\n    border-radius: 18px;\n    background: rgba(0,0,0,0.16);\n    border: 1px solid rgba(255,255,255,0.08);\n    color: var(--grey-1);\n    line-height: 1.65;\n}\n\n.footer-tag {\n    text-align: center;\n    color: var(--grey-2);\n    font-size: 0.88rem;\n    padding-top: 16px;\n}\n\n.sparkle {\n    display: inline-block;\n    color: #ffe7a1;\n    text-shadow: 0 0 10px rgba(255,231,161,0.35);\n}\n\n@media (max-width: 760px) {\n    .choices,\n    .finish-grid {\n        grid-template-columns: 1fr;\n    }\n\n    .hero,\n    .panel {\n        padding: 20px;\n        border-radius: 22px;\n    }\n\n    .badge {\n        width: 78px;\n        height: 78px;\n        border-radius: 20px;\n        font-size: 1.7rem;\n    }\n}\n\n/* Paragraph Architect-specific layout */\n.hero .subtitle { max-width: 720px; }\n.mode-badge { display:inline-flex; align-items:center; gap:8px; padding:8px 12px;\n border-radius:999px; background:rgba(226,199,122,.12); border:1px solid rgba(226,199,122,.28);\n color:#f5d999; font-size:.86rem; letter-spacing:.3px; }\n.prompt-line {display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; margin-top:18px;}\n.instruction {font-size:1rem; color:var(--grey-1); margin:10px 0 14px; line-height:1.6;}\n#card-list {display:grid; gap:12px; padding:0; margin:16px 0 8px; list-style:none;}\n.sentence-card {display:grid; grid-template-columns:40px minmax(0,1fr) auto; gap:13px; align-items:center;\n padding:14px; border-radius:16px; background:linear-gradient(135deg, rgba(255,255,255,.12), rgba(255,255,255,.045));\n border:1px solid rgba(255,255,255,.17); box-shadow:inset 0 1px rgba(255,255,255,.08);\n cursor:grab; touch-action:pan-y; transition:transform .15s,border-color .15s,background .15s;}\n.sentence-card.dragging {opacity:.43;}\n.sentence-card.drop-target {border-color:#f6d993; background:rgba(167,91,116,.4);}\n.sentence-card.wrong-position {border-color:#e79ba8;}\n.sentence-card.right-position {border-color:#8bd8b1;}\n.rank {border-radius:12px; background:rgba(20,15,20,.27); color:#f9dfa1; font-weight:900;\n min-height:40px; display:grid;place-items:center; font-size:1.1rem;}\n.card-text {font-size:1.04rem; line-height:1.5;}\n.card-controls {display:flex; flex-direction:column; gap:5px;}\n.move-btn {width:36px; height:29px; display:grid;place-items:center; color:#f4eaf1;\n background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.16); border-radius:8px;\n font-size:1.1rem; line-height:1; padding:0;}\n.move-btn:hover:not(:disabled),.move-btn:focus-visible {background:var(--maroon-2);}\n.move-btn:disabled {opacity:.25;cursor:default;}\nbutton:focus-visible, .sentence-card:focus-visible {outline:3px solid #ffe39c;outline-offset:3px;}\n.action-row {display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}\n.action-pack {display:flex;align-items:center;gap:10px;flex-wrap:wrap;}\n#feedback p {margin:0;line-height:1.6;}\n#feedback h3 {margin-bottom:7px;}\n#feedback .solution {margin-top:12px;padding:12px;background:rgba(0,0,0,.18);border-radius:12px;line-height:1.6;}\n.small-note {font-size:.86rem;color:var(--grey-2);}\n#check {background:linear-gradient(180deg,#f2d78b,#e5be62);color:#29171f; font-weight:800;\n padding:14px 22px; box-shadow:0 8px 18px rgba(0,0,0,.24);}\n#reset, #reveal {background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.15);\n color:white;padding:13px 16px;font-weight:700;}\n#next {margin:0;}\n#score-breakdown {color:var(--grey-1);line-height:1.6;}\n@media(max-width:600px) {.sentence-card {grid-template-columns:32px minmax(0,1fr) auto;gap:9px;padding:10px;}\n.card-text{font-size:.95rem}.rank{min-height:33px}.move-btn{width:32px;height:29px;}}\n<\/style>\n<\/head>\n<body>\n<main>\n<section class=\"hero\">\n <div class=\"brand-row\">\n  <div class=\"badge\" aria-hidden=\"true\">✦<\/div>\n  <div>\n   <h1>Paragraph Architect<\/h1>\n   <p class=\"subtitle\">The ideas are all there. The order is a mess. Rearrange the sentences to make the paragraph flow.<\/p>\n  <\/div>\n <\/div>\n<\/section>\n<section class=\"panel\" id=\"game\">\n <div class=\"stats\">\n  <div class=\"stats-card\" id=\"counter\"><\/div>\n  <div class=\"stats-card\" id=\"score\"><\/div>\n <\/div>\n <div class=\"progress\" aria-label=\"Round progress\"><div id=\"bar\"><\/div><\/div>\n <div class=\"prompt-line\">\n  <span class=\"mode-badge\" id=\"mode\"><\/span>\n  <span class=\"small-note\" id=\"attempts\"><\/span>\n <\/div>\n <div class=\"section-label\" id=\"challenge-name\"><\/div>\n <p class=\"instruction\" id=\"instruction\"><\/p>\n <ol id=\"card-list\" aria-label=\"Sentences to arrange\"><\/ol>\n <p class=\"small-note\">Drag cards to reorder them, or use the ↑ and ↓ buttons. The arrows also work on touchscreens.<\/p>\n <div class=\"action-row\">\n  <button id=\"reset\" type=\"button\">Shuffle Again<\/button>\n  <div class=\"action-pack\">\n   <button id=\"reveal\" type=\"button\" class=\"hidden\">Show Solution<\/button>\n   <button id=\"check\" type=\"button\">Check Paragraph ✦<\/button>\n   <button id=\"next\" type=\"button\" class=\"action-btn hidden\">Next Challenge<\/button>\n  <\/div>\n <\/div>\n <div id=\"feedback\" class=\"hidden\" aria-live=\"polite\">\n  <h3 id=\"result\"><\/h3>\n  <p id=\"explanation\"><\/p>\n  <div id=\"solution\" class=\"solution hidden\"><\/div>\n <\/div>\n<\/section>\n<section class=\"panel finish-panel hidden\" id=\"finish\">\n <h2>Round Complete <span class=\"sparkle\">✦<\/span><\/h2>\n <div class=\"score-burst\" id=\"finalScore\"><\/div>\n <p id=\"score-breakdown\"><\/p>\n <button class=\"secondary-btn\" id=\"restart\">Play Again<\/button>\n<\/section>\n<\/main>\n<script>\nconst puzzles = [\n {name:\"The Missing Trophy\", mode:\"Chronological\", hint:\"A trophy disappeared minutes before the championship ceremony. Reconstruct what happened.\",\n  lines:[\"Just before the ceremony, the team captain noticed that the championship trophy was missing from its display table.\",\"She checked the equipment room, where a volunteer remembered moving a large box out of the hallway.\",\"Inside that box, the captain found the trophy wrapped in a banner for the team's entrance.\",\"With seconds to spare, she carried it onto the stage as the crowd began to cheer.\"],\n  why:\"The paragraph begins with the discovery, follows the search, reveals the solution, and ends with the ceremony.\"},\n {name:\"Concert Countdown\",mode:\"Chronological\",hint:\"Put the backstage events in the order that makes the story understandable.\",\n  lines:[\"An hour before the school concert, the sound system suddenly stopped working.\",\"The crew traced the problem to a cable that had been damaged during setup.\",\"After replacing the cable, they tested every microphone while the performers waited backstage.\",\"By the time the doors opened, the speakers were working and the concert could begin.\"],\n  why:\"The problem comes first, followed by diagnosis, repair, and resolution.\"},\n {name:\"The Cafeteria Redesign\",mode:\"Spatial\",hint:\"Guide the reader through the redesigned cafeteria from the entrance toward the back.\",\n  lines:[\"At the cafeteria entrance, a bright mural welcomes students into the renovated space.\",\"Just beyond the doors, a row of tables provides space for students who want to work together.\",\"Along the right wall, charging stations sit beneath a bank of windows.\",\"At the far end of the room, a quiet seating area offers a break from the busiest tables.\"],\n  why:\"The description moves consistently from the entrance to nearby features and then to the far end of the room.\"},\n {name:\"Inside the Gaming Lounge\",mode:\"Spatial\",hint:\"Arrange the description as a visitor moves from the door toward the back wall.\",\n  lines:[\"From the doorway, the first thing visitors see is a glowing tournament bracket above the reception desk.\",\"A few steps inside, rows of gaming stations fill the centre of the lounge.\",\"To the left of those stations, a low sofa faces a large spectator screen.\",\"Against the back wall, shelves hold controllers and headsets that players can borrow.\"],\n  why:\"The paragraph guides a visitor inward, using location cues to build a clear mental picture.\"},\n {name:\"Late Bus Alert\",mode:\"Cause and Effect\",hint:\"Make the explanation of a delayed school bus follow a logical chain of causes.\",\n  lines:[\"Overnight rain froze on several roads as the temperature dropped below zero.\",\"Because the streets were icy, the buses had to travel more slowly than usual.\",\"As a result, many students arrived at school after the first bell.\",\"The school adjusted the morning schedule so those students would not miss their first lessons.\"],\n  why:\"Each sentence describes a consequence of the previous event: freezing, slower buses, late arrivals, then a schedule adjustment.\"},\n {name:\"Why the Video Went Viral\",mode:\"Cause and Effect\",hint:\"Follow the chain of events from an initial upload to the final result.\",\n  lines:[\"A student posted a short video of an unexpectedly impressive trick shot at lunch.\",\"Several classmates shared the clip, and it quickly reached people outside the school.\",\"A popular sports account reposted the video, bringing it to an even larger audience.\",\"By the next morning, the clip had received thousands of views and the student was being interviewed for the school announcements.\"],\n  why:\"The paragraph traces the increasing reach of the video and explains the final outcome.\"},\n {name:\"The New Phone Policy\",mode:\"Argument\",hint:\"Build a convincing paragraph from claim to reason, evidence, and conclusion.\",\n  lines:[\"Schools should provide designated times when students can check their phones.\",\"Allowing short breaks would help students manage messages without interrupting lessons.\",\"For example, a scheduled break between classes could reduce the temptation to check notifications during instruction.\",\"This approach would balance students' need to stay connected with the school's need for focused learning.\"],\n  why:\"The writer starts with a claim, gives a reason, supports it with an example, and finishes by returning to the main argument.\"},\n {name:\"A Better Spirit Week\",mode:\"Argument\",hint:\"Organize the proposal so each sentence strengthens the same central idea.\",\n  lines:[\"Student council should let more students help choose Spirit Week activities.\",\"A wider range of voices would make the events more appealing to students with different interests.\",\"For instance, a student survey could reveal demand for art contests alongside traditional sports competitions.\",\"Including those preferences would make Spirit Week feel like a celebration for the whole school.\"],\n  why:\"The paragraph progresses from recommendation to justification, example, and a concluding benefit.\"},\n {name:\"How the Robotics Team Tested Its Design\",mode:\"Process\",hint:\"Arrange the steps of a robotics test from preparation through improvement.\",\n  lines:[\"First, the team programmed the robot to follow a marked route through the classroom.\",\"Next, they ran a trial and recorded where the robot missed turns.\",\"Using those observations, the programmers adjusted the turning speed and sensor settings.\",\"Finally, they repeated the trial to see whether the changes improved performance.\"],\n  why:\"The process follows a sequence: prepare, test, revise, and retest.\"},\n {name:\"Launch Day\",mode:\"Process\",hint:\"Put the steps for launching a student podcast into a sensible sequence.\",\n  lines:[\"The podcast team began by choosing a topic and outlining the first episode.\",\"Once the outline was ready, they recorded the discussion in a quiet classroom.\",\"After recording, they removed long pauses and balanced the audio levels.\",\"With the final edit complete, they published the episode on the school website.\"],\n  why:\"Planning must happen before recording, which happens before editing and publishing.\"},\n {name:\"Streaming Versus Live Events\",mode:\"Comparison and Contrast\",hint:\"Build a comparison that introduces both options, considers a difference, and draws a conclusion.\",\n  lines:[\"Watching a concert online and attending in person can both be enjoyable, but they offer different experiences.\",\"Streaming makes it easy to watch from home without travelling or paying for transportation.\",\"Attending in person, however, allows fans to experience the crowd's energy and the music at full volume.\",\"The better choice depends on whether convenience or atmosphere matters more to the listener.\"],\n  why:\"The topic introduces the comparison, the middle sentences contrast the experiences, and the last sentence sums up the trade-off.\"},\n {name:\"Two Ways to Study\",mode:\"Comparison and Contrast\",hint:\"Arrange a paragraph that compares independent and group studying.\",\n  lines:[\"Studying alone and studying with friends can both help students prepare for a test.\",\"Working alone offers fewer distractions and lets students set their own pace.\",\"Group study, on the other hand, gives students a chance to explain difficult ideas to one another.\",\"Choosing between them depends on whether a student needs quiet focus or discussion.\"],\n  why:\"The opening sets up the comparison, the next two sentences contrast the methods, and the ending connects both to a decision.\"}\n];\n\nconst el = id => document.getElementById(id);\nfunction shuffle(items) {\n const a=[...items];\n for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }\n return a;\n}\nlet round=[], qIndex=0, order=[], attempts=0, points=0, solved=0, locked=false, draggedId=null;\nconst roundSize=6;\n\nfunction startGame(){\n round=shuffle(puzzles).slice(0,roundSize); qIndex=0;points=0;solved=0;\n el('game').classList.remove('hidden');el('finish').classList.add('hidden');loadQuestion();\n}\nfunction loadQuestion(){\n const q=round[qIndex];order=shuffle(q.lines.map((_,i)=>i));\n if(order.every((v,i)=>v===i)) [order[0],order[1]]=[order[1],order[0]];\n attempts=0;locked=false;draggedId=null;\n el('counter').textContent=`Challenge ${qIndex+1} of ${round.length}`;\n el('score').textContent=`Score: ${points}`;\n el('bar').style.width=`${qIndex/round.length*100}%`;\n el('mode').textContent=`✦ ${q.mode} organization`;\n el('challenge-name').textContent=q.name;\n el('instruction').textContent=q.hint;\n el('feedback').classList.add('hidden');el('solution').classList.add('hidden');\n el('next').classList.add('hidden');el('reveal').classList.add('hidden');\n el('check').classList.remove('hidden');el('reset').disabled=false;\n updateAttempts();renderCards();\n}\nfunction updateAttempts(){el('attempts').textContent=attempts===0?'Arrange the four sentences':`Checks used: ${attempts}`;}\nfunction move(id,step){\n if(locked)return;\n const from=order.indexOf(id),to=from+step;\n if(to<0||to>=order.length)return;\n [order[from],order[to]]=[order[to],order[from]];\n clearFeedback();renderCards();\n}\nfunction reorder(fromId,toId,after=false){\n if(locked||fromId===null||fromId===toId)return;\n let pos=order.indexOf(fromId);if(pos===-1)return;\n order.splice(pos,1);\n if(toId===null){order.push(fromId);}else{\n  let to=order.indexOf(toId); if(to<0){order.push(fromId);}else order.splice(to+(after?1:0),0,fromId);\n }\n clearFeedback();renderCards();\n}\nfunction clearFeedback(){\n if(locked)return;\n el('feedback').classList.add('hidden');\n el('reveal').classList.toggle('hidden',attempts<2);\n}\nfunction renderCards(){\n const list=el('card-list');list.replaceChildren();\n const q=round[qIndex];\n order.forEach((id,pos)=>{\n  const card=document.createElement('li');card.className='sentence-card';\n  card.draggable=!locked;card.dataset.id=id;card.tabIndex=0;\n  card.setAttribute('aria-label',`Position ${pos+1}: ${q.lines[id]}`);\n  const rank=document.createElement('span');rank.className='rank';rank.textContent=pos+1;\n  const txt=document.createElement('span');txt.className='card-text';txt.textContent=q.lines[id];\n  const controls=document.createElement('div');controls.className='card-controls';\n  for(const [dir,symbol,label] of [[-1,'↑','Move up'],[1,'↓','Move down']]){\n   const btn=document.createElement('button');btn.type='button';btn.className='move-btn';\n   btn.textContent=symbol;btn.title=label;btn.setAttribute('aria-label',`${label}: sentence ${pos+1}`);\n   btn.disabled=locked||(dir<0?pos===0:pos===order.length-1);\n   btn.addEventListener('click',()=>move(id,dir));controls.appendChild(btn);\n  }\n  card.append(rank,txt,controls);\n  card.addEventListener('dragstart',e=>{\n   if(locked)return;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(id));draggedId=id;\n   card.classList.add('dragging');\n  });\n  card.addEventListener('dragend',()=>{draggedId=null;card.classList.remove('dragging');document.querySelectorAll('.drop-target').forEach(n=>n.classList.remove('drop-target'));});\n  card.addEventListener('dragover',e=>{if(locked)return;e.preventDefault();e.dataTransfer.dropEffect='move';card.classList.add('drop-target');});\n  card.addEventListener('dragleave',()=>card.classList.remove('drop-target'));\n  card.addEventListener('drop',e=>{e.preventDefault();card.classList.remove('drop-target');\n   const raw=e.dataTransfer.getData('text/plain');const from=Number(raw);\n   if(!Number.isInteger(from))return;\n   const after=e.clientY>card.getBoundingClientRect().top+card.getBoundingClientRect().height/2;\n   reorder(from,id,after);\n  });\n  list.appendChild(card);\n });\n list.addEventListener('dragover',e=>{if(!locked)e.preventDefault();});\n}\nfunction checkParagraph(){\n if(locked)return;\n attempts++;\n const right=order.filter((id,pos)=>id===pos).length;\n const fullyCorrect=right===order.length;\n el('feedback').classList.remove('hidden');\n el('solution').classList.add('hidden');\n if(fullyCorrect){\n  locked=true;solved++;const award=attempts===1?2:1;points+=award;\n  el('score').textContent=`Score: ${points}`;\n  el('result').textContent=attempts===1?'Perfect arrangement! ✦':'You fixed the flow! ✦';\n  el('explanation').textContent=round[qIndex].why+` +${award} point${award===1?'':'s'}.`;\n  el('check').classList.add('hidden');el('reveal').classList.add('hidden');\n  el('next').textContent=qIndex===round.length-1?'View Results':'Next Challenge';\n  el('next').classList.remove('hidden');\n } else {\n  el('result').textContent=`Not quite — ${right} of ${order.length} sentences are in their intended positions.`;\n  el('explanation').textContent='Look for the topic or opening sentence first, then trace references, transitions, and how each idea leads to the next. Rearrange and check again.';\n  el('reveal').classList.toggle('hidden',attempts<2);\n }\n updateAttempts();\n document.querySelectorAll('.sentence-card').forEach((card,pos)=>{\n  card.classList.toggle('right-position',locked && order[pos]===pos);\n });\n renderCards();\n}\nfunction revealSolution(){\n if(locked||attempts<2)return;\n locked=true;\n const q=round[qIndex];\n el('result').textContent='Model arrangement';\n el('explanation').textContent=q.why;\n const sol=el('solution');sol.replaceChildren();\n q.lines.forEach((line,i)=>{const p=document.createElement('p');p.textContent=`${i+1}. ${line}`;sol.appendChild(p);});\n sol.classList.remove('hidden');\n el('feedback').classList.remove('hidden');\n el('check').classList.add('hidden');el('reveal').classList.add('hidden');\n el('next').textContent=qIndex===round.length-1?'View Results':'Next Challenge';\n el('next').classList.remove('hidden');renderCards();\n}\nfunction nextQuestion(){qIndex++;if(qIndex<round.length){loadQuestion();return;}\n el('game').classList.add('hidden');el('finish').classList.remove('hidden');\n el('finalScore').textContent=`${points} / ${round.length*2} points`;\n el('score-breakdown').textContent=`You completed ${solved} of ${round.length} paragraphs without revealing the solution. Two points are awarded for a correct first check and one for a successful revision.`;\n}\nel('check').addEventListener('click',checkParagraph);\nel('reveal').addEventListener('click',revealSolution);\nel('next').addEventListener('click',nextQuestion);\nel('reset').addEventListener('click',()=>{if(locked)return;order=shuffle(order);clearFeedback();renderCards();});\nel('restart').addEventListener('click',startGame);\nstartGame();\n<\/script>\n<script>\n(function(){\n  const report = () => {\n    const root = document.documentElement;\n    const body = document.body;\n    const height = Math.max(root.scrollHeight,body.scrollHeight,root.offsetHeight,body.offsetHeight);\n    parent.postMessage({kind:'coherence-frame-height', index:2, height}, '*');\n  };\n  addEventListener('load', report);\n  new ResizeObserver(report).observe(document.body);\n  new MutationObserver(report).observe(document.body, {subtree:true,childList:true,attributes:true,characterData:true});\n  report();\n})();\n<\/script>\n<\/body>\n<\/html>\n"];
const buttons = [...document.querySelectorAll('[role="tab"]')];
const panels = [...document.querySelectorAll('[role="tabpanel"]')];
const loaded = new Set();
function mount(index){
 if(loaded.has(index)) return;
 loaded.add(index);
 const frame = document.getElementById(`frame-${index}`);
 frame.srcdoc = documents[index];
}
function selectTab(index, focus=false){
 buttons.forEach((button,i)=>{
  const active=i===index;
  button.setAttribute('aria-selected',String(active));
  button.tabIndex=active?0:-1;
  panels[i].hidden=!active;
 });
 mount(index);
 if(focus) buttons[index].focus();
}
buttons.forEach((button,index)=>{
 button.addEventListener('click',()=>selectTab(index));
 button.addEventListener('keydown',event=>{
  if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
  event.preventDefault();
  const next=event.key==='Home'?0:event.key==='End'?2:
   (index+(event.key==='ArrowRight'?1:2))%3;
  selectTab(next,true);
 });
});
window.addEventListener('message',event=>{
 // Ignore messages not sent by our own embedded frames.
 const index = Number(event.data?.index);
 if(event.data?.kind!=='coherence-frame-height' || !Number.isInteger(index) || index<0 || index>2)return;
 const frame=document.getElementById(`frame-${index}`);
 if(event.source!==frame.contentWindow)return;
 const height=Number(event.data.height);
 if(Number.isFinite(height)&&height>0&&height<100000)frame.style.height=`${Math.ceil(height)+8}px`;
});
selectTab(0);
</script>
