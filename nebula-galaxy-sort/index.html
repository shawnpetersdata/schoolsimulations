<style>
:root { --maroon:#702d42; --ink:#242731; --gray:#67717d; --border:#d8dce3; }
* { box-sizing:border-box; }
body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:#f3f4f6; }
header { background:var(--maroon); color:white; padding:14px clamp(12px,2vw,28px); display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
h1 { font-size:clamp(18px,2vw,25px); margin:0; }
header p { margin:4px 0 0; opacity:.94; font-size:14px; }
button { font:inherit; cursor:pointer; }
.reset { background:white; color:var(--maroon); border:0; border-radius:8px; padding:9px 14px; font-size:14px; font-weight:650; }
main { margin:0 auto; max-width:1800px; padding:14px clamp(10px,1.7vw,25px); }
.tabs { display:flex; gap:8px; margin-bottom:10px; }
.tab { background:#e3e5ea; border:1px solid #d1d5de; border-radius:9px 9px 0 0; padding:11px 25px; color:#454a54; font-weight:750; font-size:17px; }
.tab[aria-selected="true"] { color:var(--maroon); background:white; border-bottom-color:white; }
.workspace { border:1px solid var(--border); border-radius:0 12px 12px 12px; background:white; padding:12px; box-shadow:0 2px 8px #00000008; }
.workspace[hidden] { display:none; }
.workspace h2 { color:var(--maroon); margin:0 0 5px 5px; font-size:19px; }
.hint { color:var(--gray); margin:0 0 11px 5px; font-size:13px; }
.board { position:relative; width:100%; height:clamp(490px,72vh,880px); border:1px solid #e3e5e8; border-radius:8px; background-color:#fafbfc; background-image: radial-gradient(#e1e4e9 0.75px,transparent 0.75px); background-size:24px 24px; overflow:hidden; touch-action:none; }
.card { position:absolute; width:clamp(85px,14.5%,190px); height:clamp(84px,24%,175px); border:2px solid #dddfe5; border-radius:7px; padding:4px; background:#0c0c12; cursor:grab; touch-action:none; user-select:none; box-shadow:0 3px 8px #0002; display:flex; align-items:center; justify-content:center; }
.card img { pointer-events:none; display:block; max-width:100%; max-height:100%; width:100%; height:100%; object-fit:contain; }
.card.dragging { z-index:100!important; cursor:grabbing; box-shadow:0 12px 25px #0005; border-color:#9d4a66; }
.card:focus-visible { outline:3px solid #2b75bf; outline-offset:2px; }
@media(max-width:700px){.board{height:600px}.card{width:18.5%;height:19%}.tab{padding:10px 17px}}

<script>
const starts = [
  [2, 6], [22, 6], [42, 6], [62, 6], [80, 6],
  [10, 43], [32, 43], [54, 43], [76, 43]
];
const boards = [...document.querySelectorAll('.board')];
let selected = 'galaxies';
let topZ = 1;
function placeInitial(board) {
  const cards = [...board.querySelectorAll('.card')];
  cards.forEach((card, i) => {
    card.style.left = starts[i][0] + '%';
    card.style.top = starts[i][1] + '%';
    card.style.zIndex = '1';
  });
}
boards.forEach(placeInitial);
function selectPage(page) {
  selected = page;
  for (const name of ['galaxies', 'nebulae']) {
    document.getElementById('panel-' + name).hidden = page !== name;
    document.getElementById('tab-' + name).setAttribute('aria-selected', String(page === name));
  }
}
for (const page of ['galaxies', 'nebulae']) {
  document.getElementById('tab-' + page).addEventListener('click', () => selectPage(page));
}
document.getElementById('reset').addEventListener('click', () => placeInitial(document.getElementById('board-' + selected)));
let dragging = null;
function move(ev) {
  if (!dragging || ev.pointerId !== dragging.pointerId) return;
  const {card, board, offsetX, offsetY} = dragging;
  const rect = board.getBoundingClientRect();
  const maxX = board.clientWidth - card.offsetWidth;
  const maxY = board.clientHeight - card.offsetHeight;
  const x = Math.max(0, Math.min(maxX, ev.clientX - rect.left - offsetX));
  const y = Math.max(0, Math.min(maxY, ev.clientY - rect.top - offsetY));
  card.style.left = 100 * x / board.clientWidth + '%';
  card.style.top = 100 * y / board.clientHeight + '%';
}
for (const board of boards) {
  board.addEventListener('pointerdown', ev => {
    const card = ev.target.closest('.card');
    if (!card || dragging || (ev.pointerType === 'mouse' && ev.button !== 0)) return;
    ev.preventDefault();
    const rect = card.getBoundingClientRect();
    dragging = {card, board, pointerId:ev.pointerId, offsetX:ev.clientX-rect.left, offsetY:ev.clientY-rect.top};
    card.style.zIndex = String(++topZ);
    card.classList.add('dragging');
    card.setPointerCapture(ev.pointerId);
  });
  board.addEventListener('pointermove', move);
  board.addEventListener('pointerup', ev => {
    if (dragging && dragging.pointerId === ev.pointerId) {
      dragging.card.classList.remove('dragging');
      dragging = null;
    }
  });
  board.addEventListener('pointercancel', () => {
    if (dragging) dragging.card.classList.remove('dragging');
    dragging = null;
  });
}
// Pointer capture sends move events to the card, which bubble to its board.
</script>
